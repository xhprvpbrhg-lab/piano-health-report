<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Piano Service Planner</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1E3A8A; --primary-mid: #1d4ed8; --primary-light: #3b82f6;
      --accent: #22C55E; --accent-dark: #16a34a;
      --bg: #f0f4f8; --card: #fff; --text: #1a202c; --muted: #6B7280; --border: #e2e8f0;
      --radius: 14px;
      --A: #16a34a; --A-bg: #dcfce7; --A-border: #86efac;
      --B: #65a30d; --B-bg: #ecfccb; --B-border: #bef264;
      --C: #d97706; --C-bg: #fef3c7; --C-border: #fcd34d;
      --D: #dc2626; --D-bg: #fee2e2; --D-border: #fca5a5;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 88px;
    }

    /* ── Header ── */
    .app-header {
      background: linear-gradient(135deg,#1E3A8A 0%,#1d4ed8 100%); color:#fff;
      padding:14px 20px 10px; position:sticky; top:0; z-index:200;
      box-shadow:0 2px 16px rgba(30,58,138,.4);
    }
    .header-top { display:flex; align-items:center; gap:12px; }
    .header-icon { flex-shrink:0; display:flex; align-items:center; }
    .header-logo-img { height:38px; width:auto; display:block; }
    .header-text h1 {
      font-family:'Poppins',-apple-system,sans-serif;
      font-size:17px; font-weight:700; letter-spacing:-.2px; line-height:1.2;
    }
    .header-text p  { font-size:11px; opacity:.72; margin-top:1px; letter-spacing:.1px; }
    .progress-wrap { margin-top:10px; display:flex; gap:5px; align-items:center; }
    .progress-seg { flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.25); transition:background .3s; }
    .progress-seg.done   { background:rgba(255,255,255,.65); }
    .progress-seg.active { background:#fff; }
    .progress-label { font-size:11px; opacity:.8; white-space:nowrap; margin-left:6px; }

    /* ── Layout ── */
    .main { max-width:820px; margin:0 auto; padding:20px 16px 4px; }
    .step-header { margin-bottom:20px; }
    .step-num   { font-size:11px; font-weight:700; color:var(--primary-light); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
    .step-title { font-family:'Poppins',-apple-system,sans-serif; font-size:24px; font-weight:700; color:var(--text); line-height:1.2; }
    .step-desc  { font-size:14px; color:var(--muted); margin-top:4px; }

    /* ── Cards ── */
    .card { background:var(--card); border-radius:var(--radius); padding:20px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04); }
    .card-title { font-family:'Poppins',-apple-system,sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--primary-mid); margin-bottom:14px; padding-bottom:10px; border-bottom:1.5px solid var(--border); }
    .card-sub { font-size:12px; color:var(--muted); margin-top:-8px; margin-bottom:14px; }

    /* ── Checkboxes ── */
    .cb-grid   { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .cb-grid-1 { display:grid; grid-template-columns:1fr; gap:8px; }
    .cb-item { display:flex; align-items:center; gap:9px; padding:11px 14px; border:1.5px solid var(--border); border-radius:10px; cursor:pointer; transition:background .12s,border-color .12s; -webkit-tap-highlight-color:transparent; }
    .cb-item.checked { background:#eff6ff; border-color:var(--primary-light); }
    .cb-item input[type=checkbox] { width:18px; height:18px; accent-color:var(--primary-mid); cursor:pointer; flex-shrink:0; }
    .cb-item span { font-size:14px; color:var(--text); user-select:none; line-height:1.3; }

    /* ── Service selection cards ── */
    .service-grid { display:grid; grid-template-columns:1fr; gap:10px; }
    @media (min-width:520px)  { .service-grid { grid-template-columns:1fr 1fr; } }
    @media (min-width:720px)  { .service-grid { grid-template-columns:1fr 1fr 1fr; } }

    .svc-card {
      border:2px solid var(--border); border-radius:12px; padding:14px 16px;
      cursor:pointer; transition:all .15s; background:#fff;
      -webkit-tap-highlight-color:transparent; position:relative;
    }
    .svc-card:active { transform:scale(.98); }
    .svc-card.selected {
      border-color:var(--primary-light); background:#eff6ff;
    }
    .svc-card.suggested:not(.selected) {
      border-color:#bfdbfe; background:#f8fbff;
    }
    .svc-card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .svc-card-name { font-family:'Poppins',-apple-system,sans-serif; font-size:15px; font-weight:700; color:var(--text); line-height:1.2; }
    .svc-card-hours {
      font-family:'Poppins',-apple-system,sans-serif;
      font-size:13px; font-weight:700; color:var(--primary-mid);
      background:#dbeafe; padding:2px 9px; border-radius:20px; white-space:nowrap; flex-shrink:0;
    }
    .svc-card.selected .svc-card-hours { background:var(--primary-mid); color:#fff; }
    .svc-card-benefit { font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:6px; }
    .svc-card-reason  { font-size:11px; color:#94a3b8; line-height:1.4; }
    .svc-check {
      position:absolute; top:10px; right:10px;
      width:22px; height:22px; border-radius:50%;
      border:2px solid var(--border); background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; transition:all .15s;
    }
    .svc-card.selected .svc-check { background:var(--primary-mid); border-color:var(--primary-mid); color:#fff; }
    .svc-suggest-badge {
      display:inline-block; font-size:9px; font-weight:800; letter-spacing:.5px;
      text-transform:uppercase; color:#2563eb; background:#dbeafe;
      padding:1px 6px; border-radius:8px; margin-bottom:6px;
    }

    /* ── Time total ── */
    .time-total {
      background:linear-gradient(135deg,#1E3A8A,#1d4ed8); color:#fff;
      border-radius:12px; padding:16px 20px;
      display:flex; align-items:center; justify-content:space-between;
      margin-top:12px;
    }
    .time-total-label { font-family:'Poppins',-apple-system,sans-serif; font-size:13px; font-weight:600; opacity:.85; }
    .time-total-value { font-family:'Poppins',-apple-system,sans-serif; font-size:30px; font-weight:800; letter-spacing:-.5px; }
    .time-total-unit  { font-family:'Poppins',-apple-system,sans-serif; font-size:14px; font-weight:600; opacity:.8; margin-left:4px; }

    /* ── Technician summary ── */
    .summary-preview {
      background:#f8fafc; border:1.5px solid var(--border); border-radius:10px;
      padding:14px 16px; font-size:14px; line-height:1.8; color:#334155;
      white-space:pre-wrap; min-height:80px; transition:border-color .2s,background .2s;
    }
    .summary-preview.active { background:#eff6ff; border-color:#bfdbfe; }
    .summary-hint { color:#94a3b8; font-size:13px; font-style:italic; }

    /* ── Findings ── */
    .findings-cat { margin-bottom:14px; }
    .findings-cat:last-child { margin-bottom:0; }
    .findings-cat-label { font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px; display:flex; align-items:center; gap:6px; }

    /* ── Form ── */
    .form-group { margin-bottom:13px; }
    .form-group:last-child { margin-bottom:0; }
    label.form-label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; letter-spacing:.3px; }
    .form-input, .form-textarea {
      width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px;
      font-size:15px; color:var(--text); background:#fff;
      transition:border-color .15s,box-shadow .15s;
      -webkit-appearance:none; appearance:none; font-family:inherit;
    }
    .form-input:focus, .form-textarea:focus { outline:none; border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .form-textarea { min-height:82px; resize:vertical; line-height:1.5; }
    .input-row   { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .input-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

    /* ── Assessment ratings ── */
    .assess-row { margin-bottom:14px; }
    .assess-name { font-size:14px; font-weight:600; color:var(--text); margin-bottom:7px; }
    .rating-row { display:flex; gap:7px; }
    .rating-btn { flex:1; padding:10px 4px; border-radius:9px; border:2px solid var(--border); background:#fff; font-size:14px; font-weight:800; cursor:pointer; transition:all .12s; text-align:center; -webkit-tap-highlight-color:transparent; line-height:1.2; }
    .rating-btn small { display:block; font-size:9px; font-weight:600; opacity:.7; margin-top:1px; }
    .rating-btn:active { transform:scale(.95); }
    .rating-btn.sel-A { background:var(--A-bg); border-color:var(--A-border); color:var(--A); }
    .rating-btn.sel-B { background:var(--B-bg); border-color:var(--B-border); color:var(--B); }
    .rating-btn.sel-C { background:var(--C-bg); border-color:var(--C-border); color:var(--C); }
    .rating-btn.sel-D { background:var(--D-bg); border-color:var(--D-border); color:var(--D); }

    /* ── Qualitative ── */
    .qual-row { display:flex; gap:7px; }
    .qual-btn { flex:1; padding:10px 4px; border-radius:9px; border:1.5px solid var(--border); background:#fff; font-size:13px; font-weight:600; cursor:pointer; text-align:center; color:var(--muted); transition:all .12s; -webkit-tap-highlight-color:transparent; }
    .qual-btn.sel { background:#eff6ff; border-color:var(--primary-light); color:var(--primary-mid); }

    /* ── Status badge ── */
    .status-card { border-radius:12px; padding:14px 18px; display:flex; align-items:center; gap:14px; }
    .status-dot  { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; color:#fff; flex-shrink:0; }
    .status-info h2 { font-size:19px; font-weight:800; line-height:1.2; }
    .status-info p  { font-size:13px; opacity:.8; margin-top:3px; }
    .s-excellent { background:#dcfce7; } .s-excellent .status-dot { background:#16a34a; } .s-excellent .status-info { color:#14532d; }
    .s-good      { background:#ecfccb; } .s-good .status-dot      { background:#65a30d; } .s-good .status-info      { color:#365314; }
    .s-fair      { background:#fef3c7; } .s-fair .status-dot      { background:#d97706; } .s-fair .status-info      { color:#78350f; }
    .s-attention { background:#fee2e2; } .s-attention .status-dot { background:#dc2626; } .s-attention .status-info { color:#7f1d1d; }

    /* ── Mini table ── */
    .mini-table { width:100%; border-collapse:collapse; }
    .mini-table td { padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .mini-table tr:last-child td { border-bottom:none; }
    .mini-table .cat { color:var(--muted); width:55%; }
    .rating-pill { display:inline-block; padding:2px 10px; border-radius:20px; font-size:13px; font-weight:800; }
    .pill-A { background:var(--A-bg); color:var(--A); } .pill-B { background:var(--B-bg); color:var(--B); }
    .pill-C { background:var(--C-bg); color:var(--C); } .pill-D { background:var(--D-bg); color:var(--D); }
    .pill-none { background:var(--border); color:var(--muted); }

    /* ── Nav ── */
    .nav-wrap  { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.95); backdrop-filter:blur(10px); border-top:1px solid var(--border); z-index:200; }
    .nav-inner { max-width:820px; margin:0 auto; padding:10px 16px 14px; display:flex; gap:10px; }
    .btn { flex:1; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; transition:all .15s; -webkit-tap-highlight-color:transparent; font-family:inherit; }
    .btn:active { transform:scale(.97); }
    .btn-back { background:var(--border); color:var(--muted); flex:.5; }
    .btn-next { background:var(--primary); color:#fff; }
    .btn-pdf  { flex:1.4; background:linear-gradient(135deg,#1E3A8A,#1d4ed8); color:#fff; display:flex; align-items:center; justify-content:center; gap:8px; font-family:'Poppins',-apple-system,sans-serif; }

    /* ── Overlay ── */
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; color:#fff; }
    .overlay .spin { width:48px; height:48px; border:4px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .overlay p { font-size:16px; font-weight:600; }

    .divider { height:1px; background:var(--border); margin:14px 0; }

    #pdf-template { position:fixed; left:-9999px; top:0; width:820px; background:#fff; font-family:'Helvetica Neue',Arial,sans-serif; }

    @media (max-width:480px) { .cb-grid { grid-template-columns:1fr; } .input-row { grid-template-columns:1fr; } }
  </style>
</head>

<header class="app-header">
  <div class="header-top">
    <div class="header-icon">
      <img src="logo.png" alt="Piano Service Planner" class="header-logo-img"
           onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'">
      <!-- SVG fallback (shown if logo.png not found) -->
      <svg id="logo-fallback" width="44" height="36" viewBox="0 0 44 36" fill="none" style="display:none">
        <rect x="0"  y="0" width="8.5" height="22" rx="1.5" fill="rgba(255,255,255,0.95)"/>
        <rect x="11" y="0" width="8.5" height="22" rx="1.5" fill="rgba(255,255,255,0.95)"/>
        <rect x="22" y="0" width="8.5" height="22" rx="1.5" fill="rgba(255,255,255,0.95)"/>
        <path d="M33 21 L33 15 Q33 10 36.5 10 Q40 10 40 15 L40 21" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="36.5" y1="21" x2="36.5" y2="29" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
        <path d="M1 27 L8.5 35 L23 19" stroke="#22C55E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="header-text">
      <h1 id="h-title">Piano Service Planner</h1>
      <p id="h-sub">Professional Piano Service Planning</p>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-seg" id="ps1"></div>
    <div class="progress-seg" id="ps2"></div>
    <div class="progress-seg" id="ps3"></div>
    <div class="progress-seg" id="ps4"></div>
    <div class="progress-seg" id="ps5"></div>
    <span class="progress-label" id="progress-label">1 / 5</span>
  </div>
</header>

<main class="main" id="main-content"></main>

<div class="nav-wrap"><div class="nav-inner" id="nav-inner"></div></div>

<div class="overlay" id="overlay" style="display:none">
  <div class="spin"></div>
  <p id="overlay-text">Generating PDF…</p>
</div>

<div id="pdf-template"></div>

function getOverallStatus() {

function getKeyFocusPoints(s) {

  const d=CATS.filter(c=>S[c]==='D').map(c=>t(c)), f=CATS.filter(c=>S[c]==='C').map(c=>t(c)), pts=[];

}

function getMeasurementStatus(field, value) {
  const v=parseFloat(value); if(isNaN(v)||value==='') return null;
  if(field==='humidity'){if(v<40)return{label:t('humLow'),note:t('humLowNote'),color:'#d97706'};if(v<=60)return{label:t('humNormal'),note:t('humNormalNote'),color:'#16a34a'};return{label:t('humHigh'),note:t('humHighNote'),color:'#dc2626'};}
  if(field==='pitch'){if(v<438)return{label:t('pitchLow'),note:t('pitchLowNote'),color:'#d97706'};if(v<=442)return{label:t('pitchNormal'),note:t('pitchNormalNote'),color:'#16a34a'};return{label:t('pitchHigh'),note:t('pitchHighNote'),color:'#d97706'};}
  if(field==='downweight'){if(v<45)return{label:t('dwLight'),note:t('dwLightNote'),color:'#3b82f6'};if(v<=56)return{label:t('dwNormal'),note:t('dwNormalNote'),color:'#16a34a'};return{label:t('dwHeavy'),note:t('dwHeavyNote'),color:'#d97706'};}
  return null;
}

// ── Summary generation ────────────────────────────────────────────
function joinEmbeds(items) {
  if (!items.length) return '';
  const emb = items.map(i => isJa ? (i.jaE||i.ja) : (i.enE||i.en));
  if (emb.length===1) return emb[0];
  if (emb.length===2) return emb.join(isJa?'と':' and ');
  return emb.slice(0,-1).join(isJa?'・':', ')+(isJa?'および':', and ')+emb[emb.length-1];
}
function getSel(cat) {
  const bools = S.findings[cat]||[];
  return FD[cat].items.filter((_,i)=>bools[i]);
}
function generateTechnicianSummary() {
  const tone=getSel('tone'), touch=getSel('touch'), tun=getSel('tuning'),
        ped=getSel('pedals'), ov=getSel('overall');
  const ovKeys=ov.map(i=>i.key);
  const any=arr=>arr.length>0;
  const anyIssue=any(tone)||any(touch)||any(tun)||any(ped);
  if(!any(ov)&&!anyIssue) return '';

  const isPlayable=ovKeys.includes('playable'), isMaint=ovKeys.includes('maintenance'),
        isFollow=ovKeys.includes('followup'), isRepair=ovKeys.includes('repair');
  const areas=[];
  if(any(tone))  areas.push(isJa?'音色':'tone quality');
  if(any(touch)) areas.push(isJa?'タッチ':'touch');
  if(any(tun))   areas.push(isJa?'調律安定性':'tuning stability');
  if(any(ped))   areas.push(isJa?'ペダル':'pedal function');

  const areaStr=areas.length===0?'':areas.length===1?areas[0]
    :areas.slice(0,-1).join(isJa?'・':', ')+(isJa?'と':' and ')+areas[areas.length-1];
  const paras=[];

  let open;
  if(isRepair)       open=isJa?'このピアノは修理のご相談をお勧めします。':'This piano requires repair consultation.';
  else if(isFollow)  open=isJa?'このピアノの状態は経過観察が推奨されます。':'This piano requires follow-up inspection to monitor its condition.';
  else if(isMaint)   open=isJa?'このピアノは演奏可能な状態ですが、メンテナンスをお勧めします。':'This piano is in playable condition, but maintenance is recommended.';
  else if(isPlayable)open=isJa?'このピアノは演奏可能な状態です。':'This piano is in playable condition.';
  else               open=isJa?'今回の診断で以下の所見が確認されました。':'The following findings were noted during the inspection.';
  if(areaStr) open+=(isJa?`${areaStr}に改善の余地があります。`:` There is room for improvement in ${areaStr}.`);
  paras.push(open);

  if(any(tone)){const j=joinEmbeds(tone);paras.push(isJa?`音色には${j}が見られます。整音やハンマー整形により、より均一で落ち着いた音色が期待できます。`:`The tone shows ${j}. Voicing and hammer shaping may help create a more even and mellow sound.`);}
  if(any(touch)){const j=joinEmbeds(touch);paras.push((isJa?'また、':'')+( isJa?`タッチには${j}が感じられます。アクション調整により、より均一で弾きやすいタッチが期待できます。`:`The touch shows ${j}. Action regulation may help create a more even and responsive feel.`));}
  if(any(tun)){const j=joinEmbeds(tun);paras.push((isJa&&(any(tone)||any(touch))?'また、':'')+(isJa?`調律面では${j}が見られます。継続してこの傾向が確認される場合は、チューニングピンや弦周りの詳細点検をお勧めします。`:`The piano shows ${j}. If this continues, a detailed inspection of the tuning pins and strings is recommended.`));}
  if(any(ped)){const j=joinEmbeds(ped);paras.push((isJa&&anyIssue?'また、':'')+(isJa?`ペダルには${j}が確認されました。ペダル整備をお勧めします。`:`The pedals show ${j}. Pedal service is recommended.`));}
  if(anyIssue||isMaint||isRepair) paras.push(isJa?'定期的なメンテナンスにより、より快適な演奏状態を保つことができます。':'Regular maintenance will help keep the piano in a more comfortable playing condition.');
  return paras.join('\n\n');
}

window.toggleFinding=(cat,idx)=>{
  if(!S.findings[cat]) S.findings[cat]=Array(FD[cat].items.length).fill(false);

  const lbl=document.querySelector(`[data-finding="${cat}-${idx}"]`);
  if(lbl){lbl.classList.toggle('checked',S.findings[cat][idx]);const cb=lbl.querySelector('input');if(cb)cb.checked=S.findings[cat][idx];}
  updateSummaryPreview();

window.toggleService=id=>{
  const idx=S.selectedServices.indexOf(id);
  if(idx>=0) S.selectedServices.splice(idx,1);
  else S.selectedServices.push(id);
  // Update card UI
  document.querySelectorAll('.svc-card').forEach(el=>{
    const onclick=el.getAttribute('onclick');
    if(onclick&&onclick.includes(`'${id}'`)){
      const sel=S.selectedServices.includes(id);

// ── PDF ───────────────────────────────────────────────────────────
async function generatePDF() {
  collectStep();
  const overlay=document.getElementById('overlay');
  document.getElementById('overlay-text').textContent=t('generatingPDF');
  overlay.style.display='flex';
  try {
    await new Promise(r=>setTimeout(r,60));
    buildPDFTemplate();
    await new Promise(r=>setTimeout(r,200));
    const tmpl=document.getElementById('pdf-template');
    const canvas=await html2canvas(tmpl,{scale:2,useCORS:true,logging:false,backgroundColor:'#ffffff',width:820});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pdfW=pdf.internal.pageSize.getWidth(),pdfH=pdf.internal.pageSize.getHeight();
    const margin=8,availW=pdfW-margin*2;
    const imgH=availW*(canvas.height/canvas.width);
    if(imgH<=pdfH-margin*2){
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',margin,margin,availW,imgH);
    } else {
      const pageH=pdfH-margin*2,scale=availW/canvas.width;
      let srcY=0,page=0;
      while(srcY<canvas.height){
        if(page>0)pdf.addPage();
        const srcH=Math.min(pageH/scale,canvas.height-srcY);
        const pc=document.createElement('canvas');pc.width=canvas.width;pc.height=srcH;
        pc.getContext('2d').drawImage(canvas,0,srcY,canvas.width,srcH,0,0,canvas.width,srcH);
        pdf.addImage(pc.toDataURL('image/jpeg',0.95),'JPEG',margin,margin,availW,srcH*scale);
        srcY+=srcH;page++;
      }
    }
    pdf.save(`piano-health-report-${S.inspectionDate||'report'}.pdf`);
  } catch(err){console.error(err);alert('PDF generation failed. Please try again.');}
  finally{overlay.style.display='none';}
}

        <span style="font-size:16px;font-weight:700;opacity:.8;margin-left:4px">${isJa?t('hours'):t(totalHours===1?'hour':'hours')}</span>
      </div>
    </div>`:''}

    <!-- 5. EXPECTED BENEFITS -->
    ${allBenefits.length?`
    <div style="border:1px solid #bbf7d0;border-radius:12px;padding:14px 18px;margin-bottom:14px;background:#f0fdf4">
      ${sh(t('pdfBenefits'),'#15803d')}
      ${allBenefits.map(b=>`<div style="display:flex;align-items:flex-start;gap:7px;margin-bottom:5px">
        <span style="color:#16a34a;font-size:13px;font-weight:800;line-height:1.5">✦</span>
        <span style="font-size:12px;color:#334155;line-height:1.6">${esc(b)}</span>
      </div>`).join('')}
    </div>`:''}

    <!-- 6+7. CONDITION ASSESSMENT + MEASUREMENTS (supporting reference) -->
    <div style="display:flex;gap:14px;margin-bottom:14px">
      <div style="flex:1.1;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;background:#fafbfc">
        ${sh(t('pdfAssessment'),'#64748b')}
        <table style="width:100%;border-collapse:collapse">
          ${cats.map(([key,label])=>{const r=S[key];const bg=r?ratingBg[r]:'#f1f5f9';const col=r?ratingColor[r]:'#94a3b8';return`<tr><td style="padding:6px 0;border-bottom:1px solid #e2e8f0;font-size:12px;color:#475569">${label}</td><td style="padding:6px 0;border-bottom:1px solid #e2e8f0;text-align:right"><span style="background:${bg};color:${col};font-weight:800;font-size:12px;padding:2px 10px;border-radius:20px">${r||'—'}</span></td></tr>`;}).join('')}
        </table>
      </div>
      ${hasMeasure?`<div style="flex:1;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;background:#fafbfc">
        ${sh(t('pdfMeasure'),'#64748b')}
        ${numFields.map(f=>{const st=getMeasurementStatus(f.key,S[f.key]);return`<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #e2e8f0">
          <div style="font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">${f.label}</div>
          <div style="display:flex;align-items:baseline;gap:5px">
            <span style="font-size:18px;font-weight:900;color:#334155">${esc(S[f.key])}</span>
            <span style="font-size:11px;color:#64748b">${f.unit}</span>
            ${st?`<span style="margin-left:auto;font-size:10px;font-weight:800;color:${st.color};background:${st.color}18;padding:1px 7px;border-radius:10px">${st.label}</span>`:''}
          </div>
          ${st?`<div style="font-size:10px;color:${st.color};margin-top:1px">${st.note}</div>`:''}
        </div>`;}).join('')}
        ${qualFields.map(f=>`<div style="margin-bottom:8px"><div style="font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">${f.label}</div><div style="font-size:13px;font-weight:700;color:#334155">${t(S[f.key])}</div></div>`).join('')}
      </div>`:''}
    </div>

    <!-- 8. TECHNICIAN NOTES -->
    ${S.techNotes?`<div style="margin-bottom:14px">
      ${sh(t('pdfNotes'),'#64748b')}
      <div style="padding:10px 13px;background:#f8fafc;border-radius:9px;border:1px solid #e2e8f0;font-size:12px;color:#475569;line-height:1.7">${esc(S.techNotes).replace(/\n/g,'<br>')}</div>
    </div>`:''}

    <!-- FOOTER -->
    <div style="border-top:1px solid #e2e8f0;padding-top:10px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:9px;color:#94a3b8;max-width:520px">${t('pdfFooter')}</div>
      <div style="font-size:9px;color:#94a3b8;white-space:nowrap;display:flex;align-items:center;gap:4px">
        <svg width="14" height="11" viewBox="0 0 44 36" fill="none"><rect x="0" y="0" width="8.5" height="22" rx="1.5" fill="#94a3b8"/><rect x="11" y="0" width="8.5" height="22" rx="1.5" fill="#94a3b8"/><rect x="22" y="0" width="8.5" height="22" rx="1.5" fill="#94a3b8"/><path d="M1 27 L8.5 35 L23 19" stroke="#22C55E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Piano Service Planner
      </div>
    </div>
  </div>`;
}

// ── Utils ─────────────────────────────────────────────────────────
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
render();
</script>
</body>
</html>
