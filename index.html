<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Piano Health Report</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1e3a5f; --primary-mid: #2563eb; --primary-light: #3b82f6;
      --bg: #f0f4f8; --card: #fff; --text: #1a202c; --muted: #64748b; --border: #e2e8f0;
      --radius: 14px;
      --A: #16a34a; --A-bg: #dcfce7; --A-border: #86efac;
      --B: #65a30d; --B-bg: #ecfccb; --B-border: #bef264;
      --C: #d97706; --C-bg: #fef3c7; --C-border: #fcd34d;
      --D: #dc2626; --D-bg: #fee2e2; --D-border: #fca5a5;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 88px; }

    .app-header { background: linear-gradient(135deg,#1e3a5f,#2563eb); color:#fff; padding:14px 18px 10px; position:sticky; top:0; z-index:200; box-shadow:0 2px 12px rgba(30,58,95,.35); }
    .header-top { display:flex; align-items:center; gap:10px; }
    .header-icon { font-size:22px; line-height:1; }
    .header-text h1 { font-size:17px; font-weight:800; letter-spacing:-.3px; }
    .header-text p  { font-size:11px; opacity:.75; margin-top:1px; }
    .progress-wrap { margin-top:10px; display:flex; gap:5px; align-items:center; }
    .progress-seg { flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.25); transition:background .3s; }
    .progress-seg.done   { background:rgba(255,255,255,.65); }
    .progress-seg.active { background:#fff; }
    .progress-label { font-size:11px; opacity:.8; white-space:nowrap; margin-left:4px; }

    .main { max-width:580px; margin:0 auto; padding:18px 14px 4px; }
    .step-header { margin-bottom:18px; }
    .step-num   { font-size:11px; font-weight:700; color:var(--primary-light); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
    .step-title { font-size:22px; font-weight:800; color:var(--text); line-height:1.2; }
    .step-desc  { font-size:14px; color:var(--muted); margin-top:4px; }

    .card { background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04); }
    .card-title { font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--primary-mid); margin-bottom:14px; padding-bottom:10px; border-bottom:1.5px solid var(--border); }

    .cb-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .cb-grid-1 { display:grid; grid-template-columns:1fr; gap:8px; }
    .cb-item { display:flex; align-items:center; gap:9px; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; cursor:pointer; transition:background .12s,border-color .12s; -webkit-tap-highlight-color:transparent; }
    .cb-item.checked { background:#eff6ff; border-color:var(--primary-light); }
    .cb-item input[type=checkbox] { width:17px; height:17px; accent-color:var(--primary-mid); cursor:pointer; flex-shrink:0; }
    .cb-item span { font-size:13px; color:var(--text); user-select:none; line-height:1.3; }

    .findings-cat { margin-bottom:16px; }
    .findings-cat:last-child { margin-bottom:0; }
    .findings-cat-label { font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px; display:flex; align-items:center; gap:6px; }

    .summary-preview {
      background:#f8fafc; border:1.5px solid var(--border); border-radius:10px;
      padding:14px 16px; font-size:14px; line-height:1.8; color:#334155;
      white-space:pre-wrap; min-height:80px; transition:border-color .2s,background .2s;
    }
    .summary-preview.active { background:#eff6ff; border-color:#bfdbfe; }
    .summary-hint { color:#94a3b8; font-size:13px; font-style:italic; }

    .form-group { margin-bottom:13px; }
    .form-group:last-child { margin-bottom:0; }
    label.form-label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px; letter-spacing:.3px; }
    .form-input, .form-textarea {
      width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px;
      font-size:15px; color:var(--text); background:#fff;
      transition:border-color .15s,box-shadow .15s;
      -webkit-appearance:none; appearance:none; font-family:inherit;
    }
    .form-input:focus, .form-textarea:focus { outline:none; border-color:var(--primary-light); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .form-textarea { min-height:78px; resize:vertical; line-height:1.5; }
    .input-row   { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .input-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

    .assess-row { margin-bottom:14px; }
    .assess-name { font-size:14px; font-weight:600; color:var(--text); margin-bottom:7px; }
    .rating-row { display:flex; gap:7px; }
    .rating-btn { flex:1; padding:10px 4px; border-radius:9px; border:2px solid var(--border); background:#fff; font-size:14px; font-weight:800; cursor:pointer; transition:all .12s; text-align:center; -webkit-tap-highlight-color:transparent; line-height:1.2; }
    .rating-btn small { display:block; font-size:9px; font-weight:600; opacity:.7; margin-top:1px; }
    .rating-btn:active { transform:scale(.95); }
    .rating-btn.sel-A { background:var(--A-bg); border-color:var(--A-border); color:var(--A); }
    .rating-btn.sel-B { background:var(--B-bg); border-color:var(--B-border); color:var(--B); }
    .rating-btn.sel-C { background:var(--C-bg); border-color:var(--C-border); color:var(--C); }
    .rating-btn.sel-D { background:var(--D-bg); border-color:var(--D-border); color:var(--D); }

    .qual-row { display:flex; gap:7px; }
    .qual-btn { flex:1; padding:9px 4px; border-radius:9px; border:1.5px solid var(--border); background:#fff; font-size:13px; font-weight:600; cursor:pointer; text-align:center; color:var(--muted); transition:all .12s; -webkit-tap-highlight-color:transparent; }
    .qual-btn.sel { background:#eff6ff; border-color:var(--primary-light); color:var(--primary-mid); }

    .status-card { border-radius:12px; padding:16px 18px; display:flex; align-items:center; gap:16px; }
    .status-dot  { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; color:#fff; flex-shrink:0; }
    .status-info h2 { font-size:20px; font-weight:800; line-height:1.2; }
    .status-info p  { font-size:13px; opacity:.8; margin-top:3px; }
    .s-excellent { background:#dcfce7; } .s-excellent .status-dot { background:#16a34a; } .s-excellent .status-info { color:#14532d; }
    .s-good      { background:#ecfccb; } .s-good .status-dot      { background:#65a30d; } .s-good .status-info      { color:#365314; }
    .s-fair      { background:#fef3c7; } .s-fair .status-dot      { background:#d97706; } .s-fair .status-info      { color:#78350f; }
    .s-attention { background:#fee2e2; } .s-attention .status-dot { background:#dc2626; } .s-attention .status-info { color:#7f1d1d; }

    .rec-list { display:flex; flex-direction:column; gap:9px; }
    .rec-item { display:flex; align-items:center; gap:11px; padding:12px 14px; background:#f0f7ff; border-left:3px solid var(--primary-light); border-radius:0 10px 10px 0; font-size:14px; font-weight:500; color:var(--text); }
    .no-recs { color:var(--muted); font-size:14px; text-align:center; padding:16px; }

    .mini-table { width:100%; border-collapse:collapse; }
    .mini-table td { padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .mini-table tr:last-child td { border-bottom:none; }
    .mini-table .cat { color:var(--muted); width:55%; }
    .rating-pill { display:inline-block; padding:2px 10px; border-radius:20px; font-size:13px; font-weight:800; }
    .pill-A { background:var(--A-bg); color:var(--A); } .pill-B { background:var(--B-bg); color:var(--B); }
    .pill-C { background:var(--C-bg); color:var(--C); } .pill-D { background:var(--D-bg); color:var(--D); }
    .pill-none { background:var(--border); color:var(--muted); }

    .nav-wrap  { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.95); backdrop-filter:blur(10px); border-top:1px solid var(--border); z-index:200; }
    .nav-inner { max-width:580px; margin:0 auto; padding:10px 14px 14px; display:flex; gap:10px; }
    .btn { flex:1; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; transition:all .15s; -webkit-tap-highlight-color:transparent; font-family:inherit; }
    .btn:active { transform:scale(.97); }
    .btn-back { background:var(--border); color:var(--muted); flex:.6; }
    .btn-next { background:var(--primary); color:#fff; }
    .btn-pdf  { flex:1.4; background:linear-gradient(135deg,#1e3a5f,#2563eb); color:#fff; display:flex; align-items:center; justify-content:center; gap:8px; }

    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; color:#fff; }
    .overlay .spin { width:48px; height:48px; border:4px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .overlay p { font-size:16px; font-weight:600; }

    .divider { height:1px; background:var(--border); margin:14px 0; }

    #pdf-template { position:fixed; left:-9999px; top:0; width:820px; background:#fff; font-family:'Helvetica Neue',Arial,sans-serif; }

    @media (max-width:380px) { .cb-grid { grid-template-columns:1fr; } .input-row { grid-template-columns:1fr; } }
  </style>
</head>

const cd = r => r === 'C' || r === 'D';

function getOverallStatus() {
  const rated = CATS.map(c => S[c]).filter(Boolean);
  if (!rated.length) return null;
  if (rated.includes('D')) return 'attention';
  if (rated.includes('C')) return 'fair';
  if (rated.includes('B')) return 'good';
  return 'excellent';
}
function statusClass(s) { return {excellent:'s-excellent',good:'s-good',fair:'s-fair',attention:'s-attention'}[s]||'s-good'; }
function statusLabel(s) { return {excellent:t('excellent'),good:t('good'),fair:t('fair'),attention:t('attention')}[s]||'—'; }
function statusEmoji(s) { return {excellent:'✦',good:'✓',fair:'!',attention:'!'}[s]||'?'; }
function getOverallContextText(s) { return {excellent:t('ctxExcellent'),good:t('ctxGood'),fair:t('ctxFair'),attention:t('ctxAttention')}[s]||''; }
function getKeyFocusPoints(s) {
  if (!s||s==='excellent') return [];
  const d=CATS.filter(c=>S[c]==='D').map(c=>t(c)), f=CATS.filter(c=>S[c]==='C').map(c=>t(c)), pts=[];
  if (d.length) pts.push(isJa?`${d.join('・')}は緊急対応が必要です`:`${d.join(', ')} requires immediate attention`);
  if (f.length) pts.push(isJa?`${f.join('・')}に改善の余地があります`:`${f.join(', ')} has room for improvement`);
  return pts;
}
function getNextStepText(recs) {
  if (!recs||!recs.length) return t('nextStepMaintain');
  return tr(recs[0].key);
}
function getRecommendations() {
  const recs=[], seen=new Set();
  const add=(icon,key)=>{if(!seen.has(key)){seen.add(key);recs.push({icon,key});}};
  if(cd(S.hammers)){add('🔨','voicing');add('🎯','hammerShaping');if(S.hammers==='D')add('🔧','hammerReplacement');}
  if(cd(S.tone)&&!cd(S.hammers)) add('🎵','toneImprovement');
  if(cd(S.tuningStability)){add('🎼','pitchStabilization');add('🔩','pinInspection');}
  if(cd(S.touch)||cd(S.action)) add('⚙️','actionRegulation');
  if(cd(S.pedals)) add('🦶','pedalService');
  return recs;
}

      if(ci(0)) reasons.push(isJa?'「音が明るすぎる」というご要望があります。':'Customer reported the tone is too bright.');
      if(ci(1)) reasons.push(isJa?'「音が暗すぎる」というご要望があります。':'Customer reported the tone is too dull.');
      benefits.push(isJa?'より柔らかく均一な音色に近づきます。':'A more even and mellow tone quality.',isJa?'強弱表現がしやすくなります。':'Improved dynamic control and expressiveness.');break;
    case 'hammerShaping':
      if(S.hammers) reasons.push(isJa?`ハンマー表面の摩耗が評価${S.hammers}です。`:`Hammer surface wear was rated ${S.hammers}.`);
      benefits.push(isJa?'クリアで芯のある音色になります。':'Cleaner, more focused tone.',isJa?'音域全体の均一性が向上します。':'More consistent tone across registers.');break;
    case 'hammerReplacement':

    case 'toneImprovement':
      if(S.tone) reasons.push(isJa?`音色評価が${S.tone}です。`:`Tone was rated ${S.tone}.`);
      if(ci(0)) reasons.push(isJa?'「音が明るすぎる」というご要望があります。':'Customer reported the tone is too bright.');
      if(ci(1)) reasons.push(isJa?'「音が暗すぎる」というご要望があります。':'Customer reported the tone is too dull.');
      benefits.push(isJa?'音色バランスが改善します。':'Improved tonal balance.',isJa?'弾き心地と表現力が向上します。':'Enhanced playability and expressiveness.');break;
    case 'pitchStabilization':
      if(S.tuningStability) reasons.push(isJa?`調律安定性の評価が${S.tuningStability}です。`:`Tuning stability was rated ${S.tuningStability}.`);
      if(ci(4)) reasons.push(isJa?'「調律が安定しない」というご要望があります。':'Customer reported that tuning does not hold.');
      benefits.push(isJa?'調律が長持ちするようになります。':'Tuning holds longer between services.',isJa?'全音域にわたり安定したピッチが保たれます。':'Consistent pitch across all registers.');break;
    case 'pinInspection':
      if(S.tuningStability) reasons.push(isJa?`調律安定性評価${S.tuningStability}により、チューニングピンの点検が必要です。`:`Tuning stability rated ${S.tuningStability} warrants tuning pin inspection.`);
      benefits.push(isJa?'調律不安定の根本原因を特定します。':'Identifies the root cause of tuning instability.',isJa?'長期的な調律信頼性を確保します。':'Ensures long-term tuning reliability.');break;
    case 'actionRegulation':
      {const parts=[];
      if(S.touch&&cd(S.touch)) parts.push(isJa?`タッチ評価${S.touch}`:`Touch rated ${S.touch}`);
      if(S.action&&cd(S.action)) parts.push(isJa?`アクション評価${S.action}`:`Action rated ${S.action}`);
      if(parts.length) reasons.push(parts.join(isJa?'・':', ')+(isJa?'により調整が必要です。':' indicates regulation is needed.'));
      if(ci(2)) reasons.push(isJa?'「タッチが重すぎる」というご要望があります。':'Customer reported touch is too heavy.');
      if(ci(3)) reasons.push(isJa?'「タッチが軽すぎる」というご要望があります。':'Customer reported touch is too light.');}
      benefits.push(isJa?'鍵盤の均一性と応答性が改善します。':'More even and responsive key action.',isJa?'ダイナミクスコントロールが向上します。':'Improved dynamic control.');break;
    case 'pedalService':
      if(S.pedals) reasons.push(isJa?`ペダルの状態評価が${S.pedals}です。`:`Pedal condition was rated ${S.pedals}.`);
      if(ci(5)) reasons.push(isJa?'ペダルに関するご要望があります。':'Customer reported pedal concerns.');
      benefits.push(isJa?'スムーズで安定したペダル操作が可能になります。':'Smooth, reliable pedal operation.',isJa?'サスティンとソフトペダルの機能が改善します。':'Restored sustain and soft pedal function.');break;
  }
  return {reasons,benefits};

function getMeasurementStatus(field,value) {
  const v=parseFloat(value); if(isNaN(v)||value==='') return null;
  if(field==='humidity'){if(v<40)return{label:t('humLow'),note:t('humLowNote'),color:'#d97706'};if(v<=60)return{label:t('humNormal'),note:t('humNormalNote'),color:'#16a34a'};return{label:t('humHigh'),note:t('humHighNote'),color:'#dc2626'};}
  if(field==='pitch'){if(v<438)return{label:t('pitchLow'),note:t('pitchLowNote'),color:'#d97706'};if(v<=442)return{label:t('pitchNormal'),note:t('pitchNormalNote'),color:'#16a34a'};return{label:t('pitchHigh'),note:t('pitchHighNote'),color:'#d97706'};}
  if(field==='downweight'){if(v<45)return{label:t('dwLight'),note:t('dwLightNote'),color:'#3b82f6'};if(v<=56)return{label:t('dwNormal'),note:t('dwNormalNote'),color:'#16a34a'};return{label:t('dwHeavy'),note:t('dwHeavyNote'),color:'#d97706'};}
  return null;
}

// ── Summary generation ────────────────────────────────────────────
function joinEmbeds(items) {
  if (!items.length) return '';
  const emb = items.map(i => isJa ? (i.jaE||i.ja) : (i.enE||i.en));
  if (emb.length===1) return emb[0];
  if (emb.length===2) return emb.join(isJa?'と':' and ');
  return emb.slice(0,-1).join(isJa?'・':', ')+(isJa?'および':', and ')+emb[emb.length-1];
}

function getSel(cat) {
  const bools = S.findings[cat]||[];
  return FD[cat].items.filter((_,i)=>bools[i]);
}

function generateTechnicianSummary() {
  const tone=getSel('tone'), touch=getSel('touch'), tun=getSel('tuning'),
        ped=getSel('pedals'), ov=getSel('overall');
  const ovKeys=ov.map(i=>i.key);
  const any=arr=>arr.length>0;
  const anyIssue=any(tone)||any(touch)||any(tun)||any(ped);
  if(!any(ov)&&!anyIssue) return '';

  const isPlayable=ovKeys.includes('playable'), isMaint=ovKeys.includes('maintenance'),
        isFollow=ovKeys.includes('followup'),   isRepair=ovKeys.includes('repair');

  const areas=[];
  if(any(tone))  areas.push(isJa?'音色':'tone quality');
  if(any(touch)) areas.push(isJa?'タッチ':'touch');
  if(any(tun))   areas.push(isJa?'調律安定性':'tuning stability');
  if(any(ped))   areas.push(isJa?'ペダル':'pedal function');

  const areaStr = areas.length===0?'':areas.length===1?areas[0]
    :areas.slice(0,-1).join(isJa?'・':', ')+(isJa?'と':' and ')+areas[areas.length-1];

  const paras=[];

  // P1: Opening
  let open;
  if(isRepair)      open=isJa?'このピアノは修理のご相談をお勧めします。':'This piano requires repair consultation.';
  else if(isFollow) open=isJa?'このピアノの状態は経過観察が推奨されます。':'This piano requires follow-up inspection to monitor its condition.';
  else if(isMaint)  open=isJa?'このピアノは演奏可能な状態ですが、メンテナンスをお勧めします。':'This piano is in playable condition, but maintenance is recommended.';
  else if(isPlayable)open=isJa?'このピアノは演奏可能な状態です。':'This piano is in playable condition.';
  else               open=isJa?'今回の診断で以下の所見が確認されました。':'The following findings were noted during the inspection.';
  if(areaStr) open+=(isJa?`${areaStr}に改善の余地があります。`:` There is room for improvement in ${areaStr}.`);
  paras.push(open);

  // P2: Tone
  if(any(tone)){
    const j=joinEmbeds(tone);
    paras.push(isJa
      ?`音色には${j}が見られます。整音やハンマー整形により、より均一で落ち着いた音色が期待できます。`
      :`The tone shows ${j}. Voicing and hammer shaping may help create a more even and mellow sound.`);
  }
  // P3: Touch
  if(any(touch)){
    const j=joinEmbeds(touch);
    paras.push((isJa?'また、':'')+(isJa
      ?`タッチには${j}が感じられます。アクション調整により、より均一で弾きやすいタッチが期待できます。`
      :`The touch shows ${j}. Action regulation may help create a more even and responsive feel.`));
  }
  // P4: Tuning
  if(any(tun)){
    const j=joinEmbeds(tun);
    paras.push((isJa&&(any(tone)||any(touch))?'また、':'')+(isJa
      ?`調律面では${j}が見られます。継続してこの傾向が確認される場合は、チューニングピンや弦周りの詳細点検をお勧めします。`
      :`The piano shows ${j}. If this continues, a detailed inspection of the tuning pins and strings is recommended.`));
  }
  // P5: Pedals
  if(any(ped)){
    const j=joinEmbeds(ped);
    paras.push((isJa&&anyIssue?'また、':'')+(isJa
      ?`ペダルには${j}が確認されました。ペダル整備をお勧めします。`
      :`The pedals show ${j}. Pedal service is recommended.`));
  }
  // Closing
  if(anyIssue||isMaint||isRepair){
    paras.push(isJa
      ?'定期的なメンテナンスにより、より快適な演奏状態を保つことができます。'
      :'Regular maintenance will help keep the piano in a more comfortable playing condition.');
  }
  return paras.join('\n\n');
}

    <div class="card-title">${t('techFindings')}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:14px;margin-top:-8px">${t('techFindingsDesc')}</div>
    ${findingsHTML}
  </div>

  <!-- Auto summary preview -->
  <div class="card">
    <div class="card-title">${t('techSummaryTitle')}</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px;margin-top:-8px;display:flex;align-items:center;gap:5px">
      <span style="background:#dbeafe;color:#1d4ed8;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px">AUTO</span>
      ${t('techSummaryAuto')}
    </div>
    <div class="summary-preview${summary?' active':''}" id="summary-preview">${summary?esc(summary).replace(/\n\n/g,'<br><br>'):`<span class="summary-hint">${t('noFindingsHint')}</span>`}</div>

  <!-- Overall condition -->
  ${status?`<div class="card"><div class="card-title">${t('overallCondition')}</div>
    <div class="status-card ${sc}"><div class="status-dot">${statusEmoji(status)}</div>
    <div class="status-info"><h2>${statusLabel(status)}</h2><p>${getOverallContextText(status)}</p></div></div>
  </div>`:''}

  <!-- Assessment -->
  <div class="card"><div class="card-title">${t('conditionAssessment')}</div>
    <table class="mini-table">${cats.map(([key,label])=>{const r=S[key];return`<tr><td class="cat">${label}</td><td><span class="rating-pill ${r?'pill-'+r:'pill-none'}">${r||'—'}</span></td></tr>`;}).join('')}</table>
  </div>

  <!-- Customer goals -->
  ${(impSel.length||presSel.length)?`<div class="card"><div class="card-title">${t('customerGoals')}</div>

    ${presSel.length?`<div><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">${t('preserveSummaryLabel')}</div><div style="font-size:14px;line-height:1.8">${presSel.map(o=>`✓ ${o}`).join('<br>')}</div></div>`:''}
  </div>`:''}

  <!-- Recommendations -->
  <div class="card"><div class="card-title">${t('recommendations')}</div>
    ${recs.length?`<div class="rec-list">${recs.map(r=>`<div class="rec-item"><span>${r.icon}</span><span>${tr(r.key)}</span></div>`).join('')}</div>`:`<div class="no-recs">${t('noRecs')}</div>`}
  </div>

  <!-- Tech notes -->
  <div class="card"><div class="card-title">${t('techNotes')}</div>
    <textarea class="form-textarea" id="techNotes" placeholder="${t('notesPlaceholder')}" style="min-height:90px">${esc(S.techNotes)}</textarea>
  </div>`;
}

function renderNav() {
  const el=document.getElementById('nav-inner');
  if(S.step===1) el.innerHTML=`<button class="btn btn-next" onclick="goNext()">${t('next')}</button>`;
  else if(S.step<5) el.innerHTML=`<button class="btn btn-back" onclick="goBack()">${t('back')}</button><button class="btn btn-next" onclick="goNext()">${t('next')}</button>`;
  else el.innerHTML=`<button class="btn btn-back" onclick="goBack()">${t('back')}</button><button class="btn btn-pdf btn-next" onclick="generatePDF()"><span>${t('pdfIcon')}</span> ${t('generatePDF')}</button>`;
}

// ── Event handlers ────────────────────────────────────────────────
function attachListeners() {
  const bind=(id,key)=>{const el=document.getElementById(id);if(el)el.addEventListener('input',e=>{S[key]=e.target.value;save();});};
  bind('improveComment','improveComment');bind('preserveComment','preserveComment');
  ['customerName','manufacturer','model','serialNumber','year','inspectionDate'].forEach(k=>bind('f-'+k,k));
  ['humidity','pitch','downweight'].forEach(k=>bind('f-'+k,k));
  bind('techNotes','techNotes');
  if(S.step===5) updateSummaryPreview();
}

window.toggleImprove=i=>{
  S.improve[i]=!S.improve[i];
  const items=document.querySelectorAll('#main-content .card:nth-child(2) .cb-item');
  if(items[i]){items[i].classList.toggle('checked',S.improve[i]);const cb=items[i].querySelector('input');if(cb)cb.checked=S.improve[i];}
  save();
};
window.togglePreserve=i=>{
  S.preserve[i]=!S.preserve[i];
  const items=document.querySelectorAll('#main-content .card:nth-child(3) .cb-item');
  if(items[i]){items[i].classList.toggle('checked',S.preserve[i]);const cb=items[i].querySelector('input');if(cb)cb.checked=S.preserve[i];}
  save();
};
window.setRating=(key,val)=>{
  S[key]=val;
  const order=['touch','tone','action','hammers','pedals','tuningStability'];
  const idx=order.indexOf(key);
  const rows=document.querySelectorAll('.assess-row');
  if(idx>=0&&rows[idx])rows[idx].querySelectorAll('.rating-btn').forEach((btn,bi)=>{const r=['A','B','C','D'][bi];btn.className='rating-btn'+(val===r?' sel-'+r:'');});
  save();
};
window.setQual=(id,val)=>{S[id]=S[id]===val?'':val;render();};

window.toggleFinding=(cat,idx)=>{
  if(!S.findings[cat]) S.findings[cat]=Array(FD[cat].items.length).fill(false);
  S.findings[cat][idx]=!S.findings[cat][idx];
  const lbl=document.querySelector(`[data-finding="${cat}-${idx}"]`);
  if(lbl){lbl.classList.toggle('checked',S.findings[cat][idx]);const cb=lbl.querySelector('input');if(cb)cb.checked=S.findings[cat][idx];}
  updateSummaryPreview();
  save();
};

function updateSummaryPreview() {
  const el=document.getElementById('summary-preview');
  if(!el) return;
  const text=generateTechnicianSummary();
  if(text){
    el.innerHTML=esc(text).replace(/\n\n/g,'<br><br>');
    el.classList.add('active');
  } else {
    el.innerHTML=`<span class="summary-hint">${t('noFindingsHint')}</span>`;
    el.classList.remove('active');
  }
}

function collectStep(){
  if(S.step===2)['customerName','manufacturer','model','serialNumber','year','inspectionDate'].forEach(k=>{const el=document.getElementById('f-'+k);if(el)S[k]=el.value;});
  if(S.step===4)['humidity','pitch','downweight'].forEach(k=>{const el=document.getElementById('f-'+k);if(el)S[k]=el.value;});
  if(S.step===5){const el=document.getElementById('techNotes');if(el)S.techNotes=el.value;}
  save();
}
function goNext(){collectStep();if(S.step<5){S.step++;render();window.scrollTo(0,0);}}
function goBack(){collectStep();if(S.step>1){S.step--;render();window.scrollTo(0,0);}}

// ── PDF generation ────────────────────────────────────────────────
async function generatePDF() {
  collectStep();
  const overlay=document.getElementById('overlay');
  document.getElementById('overlay-text').textContent=t('generatingPDF');
  overlay.style.display='flex';
  try {
    await new Promise(r=>setTimeout(r,60));
    buildPDFTemplate();
    await new Promise(r=>setTimeout(r,180));
    const tmpl=document.getElementById('pdf-template');
    const canvas=await html2canvas(tmpl,{scale:2,useCORS:true,logging:false,backgroundColor:'#ffffff',width:820});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pdfW=pdf.internal.pageSize.getWidth(),pdfH=pdf.internal.pageSize.getHeight();
    const margin=8,availW=pdfW-margin*2;
    const imgH=availW*(canvas.height/canvas.width);
    if(imgH<=pdfH-margin*2){
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',margin,margin,availW,imgH);
    } else {
      const pageH=pdfH-margin*2,scale=availW/canvas.width;
      let srcY=0,page=0;
      while(srcY<canvas.height){
        if(page>0)pdf.addPage();
        const srcH=Math.min(pageH/scale,canvas.height-srcY);
        const pc=document.createElement('canvas');pc.width=canvas.width;pc.height=srcH;
        pc.getContext('2d').drawImage(canvas,0,srcY,canvas.width,srcH,0,0,canvas.width,srcH);
        pdf.addImage(pc.toDataURL('image/jpeg',0.95),'JPEG',margin,margin,availW,srcH*scale);
        srcY+=srcH;page++;
      }
    }
    pdf.save(`piano-health-report-${S.inspectionDate||'report'}.pdf`);
  } catch(err){console.error(err);alert('PDF generation failed. Please try again.');}
  finally{overlay.style.display='none';}
}

function buildPDFTemplate() {
  const status=getOverallStatus()||'good', recs=getRecommendations();
  const io=t('improveOpts'),po=t('preserveOpts');
  const impSel=io.filter((_,i)=>S.improve[i]),presSel=po.filter((_,i)=>S.preserve[i]);
  const cats=[['touch',t('touch')],['tone',t('tone')],['action',t('action')],['hammers',t('hammers')],['pedals',t('pedals')],['tuningStability',t('tuningStability')]];
  const keyPoints=getKeyFocusPoints(status), nextStep=getNextStepText(recs);

  const ratingColor={A:'#16a34a',B:'#65a30d',C:'#d97706',D:'#dc2626'};

    fair:     {bg:'#fef3c7',border:'#fcd34d',dot:'#d97706',text:'#78350f'},

  const snYear=[S.serialNumber?`S/N: ${S.serialNumber}`:'',S.year||''].filter(Boolean).join('  ·  ');

  const check=(txt,col='#2563eb')=>`<div style="display:flex;align-items:flex-start;gap:5px;margin-bottom:3px"><span style="color:${col};font-size:11px;line-height:1.5">✓</span><span style="font-size:11px;color:#334155;line-height:1.5">${txt}</span></div>`;

  const numFields=[
    {key:'humidity',label:t('humidity').replace(/ \(%\)/,'').replace('（%）',''),unit:'%'},
    {key:'pitch',   label:t('pitch').replace(/ \(Hz\)/,'').replace('（Hz）',''),unit:'Hz'},
    {key:'downweight',label:t('downweight').replace(/ \(g\)/,'').replace('（g）',''),unit:'g'},
  ].filter(f=>S[f.key]);
  const qualFields=[{key:'keyDip',label:t('keyDip')},{key:'letOff',label:t('letOff')}].filter(f=>S[f.key]);
  const hasMeasure=numFields.length||qualFields.length;

  const recCardsHTML=recs.map(r=>{
    const {reasons,benefits}=buildRecDetail(r.key);
    return `<div style="border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 15px;margin-bottom:9px;background:#fafbfc">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid #e2e8f0">
        <span style="font-size:16px">${r.icon}</span>
        <span style="font-size:13px;font-weight:900;color:#1e3a5f">${tr(r.key)}</span>
      </div>
      <div style="display:flex;gap:14px">
        <div style="flex:1">
          <div style="font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#64748b;margin-bottom:5px">${t('pdfReason')}</div>
          ${reasons.map(s=>bullet(s,'#d97706')).join('')}${!reasons.length?`<div style="font-size:11px;color:#94a3b8">—</div>`:''}
        </div>
        <div style="flex:1">
          <div style="font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#16a34a;margin-bottom:5px">${t('pdfBenefits')}</div>
          ${benefits.map(s=>bullet(s,'#16a34a')).join('')}
        </div>
      </div>
    </div>`;
  }).join('');

  // Tech summary paragraphs for PDF
  const summaryParasHTML=techSummary
    ? techSummary.split('\n\n').map(p=>`<p style="font-size:12px;color:#334155;line-height:1.75;margin-bottom:8px">${esc(p)}</p>`).join('')
    : '';

  document.getElementById('pdf-template').innerHTML=`
  <div style="background:#fff;padding:26px 30px;font-family:'Helvetica Neue',Arial,sans-serif;color:#1a202c;width:820px">

    <!-- HEADER -->
    <div style="background:linear-gradient(135deg,#1e3a5f,#2563eb);border-radius:12px;padding:18px 24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;color:#fff">
      <div>
        <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:.75;margin-bottom:3px">🎹 ${t('pdfHeaderSub')}</div>
        <div style="font-size:21px;font-weight:900;letter-spacing:-.5px">${esc(pianoLine)}</div>
        ${snYear?`<div style="font-size:11px;opacity:.75;margin-top:2px">${esc(snYear)}</div>`:''}
      </div>
      <div style="text-align:right">
        ${S.customerName?`<div style="font-size:14px;font-weight:700">${esc(S.customerName)}</div>`:''}
        <div style="font-size:11px;opacity:.8;margin-top:2px">${dateStr}</div>
      </div>
    </div>

    <!-- 1. OVERALL CONDITION -->
    <div style="border:2px solid ${sc.border};background:${sc.bg};border-radius:12px;padding:16px 20px;margin-bottom:14px">
      <div style="font-size:9px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:${sc.text};opacity:.7;margin-bottom:8px">${t('pdfSectionOverall')}</div>
      <div style="display:flex;align-items:flex-start;gap:18px">
        <div style="width:56px;height:56px;background:${sc.dot};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0">${statusEmoji(status)}</div>
        <div style="flex:1">
          <div style="font-size:21px;font-weight:900;color:${sc.text};margin-bottom:5px">${statusLabel(status)}</div>
          <div style="font-size:11px;color:${sc.text};line-height:1.6;margin-bottom:${keyPoints.length?'8px':'0'}">${getOverallContextText(status)}</div>
          ${keyPoints.length?`<div style="margin-bottom:8px">${keyPoints.map(p=>`<div style="display:flex;align-items:flex-start;gap:5px;margin-bottom:2px"><span style="font-size:11px;color:${sc.dot}">▶</span><span style="font-size:11px;color:${sc.text};font-weight:600">${p}</span></div>`).join('')}</div>`:''}
          <div style="background:rgba(255,255,255,0.6);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:10px">
            <span style="font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:${sc.text};opacity:.7">${t('pdfNextStep')}</span>
            <span style="font-size:12px;font-weight:800;color:${sc.dot}">${esc(nextStep)}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. CUSTOMER GOALS -->
    ${(impSel.length||presSel.length||S.improveComment||S.preserveComment)?`
    <div style="border:1px solid #e2e8f0;border-radius:12px;padding:14px 18px;margin-bottom:14px;background:#f8fafc">
      ${sh(t('pdfSectionGoals'),'#2563eb')}
      <div style="display:flex;gap:22px">
        ${(impSel.length||S.improveComment)?`<div style="flex:1">
          <div style="font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">${t('pdfImprove')}</div>
          ${impSel.map(o=>check(o,'#2563eb')).join('')}
          ${S.improveComment?`<div style="margin-top:5px;padding:5px 9px;background:#eff6ff;border-radius:6px;font-size:11px;color:#475569;font-style:italic">${esc(S.improveComment)}</div>`:''}
        </div>`:''}
        ${(presSel.length||S.preserveComment)?`<div style="flex:1">
          <div style="font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">${t('pdfPreserve')}</div>
          ${presSel.map(o=>check(o,'#22c55e')).join('')}
          ${S.preserveComment?`<div style="margin-top:5px;padding:5px 9px;background:#f0fdf4;border-radius:6px;font-size:11px;color:#475569;font-style:italic">${esc(S.preserveComment)}</div>`:''}
        </div>`:''}
      </div>
    </div>`:''}

    <!-- 3. TECHNICIAN SUMMARY -->
    ${techSummary?`
    <div style="border:1px solid #dbeafe;border-radius:12px;padding:14px 18px;margin-bottom:14px;background:#f0f7ff">
      ${sh(t('pdfSectionTechSummary'),'#1d4ed8')}
      ${summaryParasHTML}
    </div>`:''}

    <!-- 4+5. CONDITION ASSESSMENT + MEASUREMENTS (two-col) -->
    <div style="display:flex;gap:14px;margin-bottom:14px">
      <div style="flex:1.1;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;background:#fafbfc">
        ${sh(t('pdfSectionAssess'))}
        <table style="width:100%;border-collapse:collapse">
          ${cats.map(([key,label])=>{const r=S[key];const bg=r?ratingBg[r]:'#f1f5f9';const col=r?ratingColor[r]:'#94a3b8';return`<tr><td style="padding:6px 0;border-bottom:1px solid #e2e8f0;font-size:12px;color:#475569">${label}</td><td style="padding:6px 0;border-bottom:1px solid #e2e8f0;text-align:right"><span style="background:${bg};color:${col};font-weight:800;font-size:12px;padding:2px 10px;border-radius:20px">${r||'—'}</span></td></tr>`;}).join('')}
        </table>
      </div>
      ${hasMeasure?`<div style="flex:1;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;background:#fafbfc">
        ${sh(t('pdfSectionMeasure'))}
        ${numFields.map(f=>{const st=getMeasurementStatus(f.key,S[f.key]);return`<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #e2e8f0">

    <!-- 6. RECOMMENDED SERVICES -->

    <div style="border-top:1px solid #e2e8f0;padding-top:10px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:9px;color:#94a3b8;max-width:480px">${t('pdfFooter')}</div>

    </div>
  </div>`;
}

// ── Utils ─────────────────────────────────────────────────────────
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

render();
</script>
