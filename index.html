<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Piano Service Planner</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Brand palette */
      --navy:#1E3A8A; --navy-700:#1b347c; --navy-900:#15296b;
      --green:#22C55E; --green-700:#16a34a;
      --gray:#6B7280; --gray-soft:#9aa3b2;
      --bg:#F8FAFC; --surface:#FFFFFF;
      --text:#0F172A; --text-2:#334155; --text-3:#64748B;
      --border:#E5E7EB; --border-soft:#EEF2F6;
      --radius:12px; --radius-sm:9px;
      /* Aliases (kept for existing markup) */
      --primary:#1E3A8A; --primary-mid:#1E3A8A; --primary-light:#3b82f6;
      --accent:#22C55E; --accent-dark:#16a34a; --card:#FFFFFF; --muted:#6B7280;
      /* Rating scale — muted, professional */
      --A:#15803D; --A-bg:#ECFDF3; --A-border:#A7F3C8;
      --B:#3F6212; --B-bg:#F4FBE8; --B-border:#D4ED9B;
      --C:#9A6700; --C-bg:#FFF8EB; --C-border:#FCE2A6;
      --D:#B42318; --D-bg:#FEF2F1; --D-border:#FBC9C4;
      /* Right preview-pane width on iPad/desktop (~22-25%) */
      --pv-w:300px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 92px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .app-header {
      background: var(--navy); color:#fff;
      padding:0; position:sticky; top:0; z-index:200;
      border-bottom:1px solid rgba(255,255,255,.08);
      box-shadow:0 1px 3px rgba(15,23,42,.12);
    }
    .header-top {
      max-width:820px; margin:0 auto;
      display:flex; align-items:center; gap:12px;
      padding:13px 16px 12px;
    }
    .brand-mark { flex-shrink:0; display:block; }
    .brand-divider { width:1px; height:30px; background:rgba(255,255,255,.18); flex-shrink:0; }
    .header-text { display:flex; flex-direction:column; }
    .header-text h1 {
      font-family:'Poppins',-apple-system,sans-serif;
      font-size:16.5px; font-weight:700; letter-spacing:-.2px; line-height:1.15; color:#fff;
    }
    .header-text p { font-size:11px; font-weight:500; opacity:.6; margin-top:2px; letter-spacing:.1px; }

    /* Workflow tab navigation */
    .tab-nav {
      max-width:820px; margin:0 auto;
      padding:0 12px 11px; display:flex; gap:6px; align-items:center;
      overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .tab-nav::-webkit-scrollbar { display:none; }
    .tab {
      flex:0 0 auto; display:inline-flex; align-items:center; gap:7px;
      padding:7px 13px; border-radius:99px;
      font-family:'Poppins',sans-serif; font-size:12.5px; font-weight:600;
      color:rgba(255,255,255,.6); background:rgba(255,255,255,.08);
      border:1px solid transparent; white-space:nowrap; cursor:pointer;
      transition:background .15s,color .15s; -webkit-tap-highlight-color:transparent;
    }
    .tab:hover { color:rgba(255,255,255,.9); background:rgba(255,255,255,.15); }
    .tab-num {
      display:inline-flex; align-items:center; justify-content:center;
      width:17px; height:17px; border-radius:50%; flex-shrink:0;
      font-size:10px; font-weight:700; background:rgba(255,255,255,.2); color:#fff;
    }
    .tab.done .tab-num { background:var(--green); color:#fff; }
    .tab.active { background:#fff; color:var(--navy); box-shadow:0 1px 4px rgba(0,0,0,.18); }
    .tab.active .tab-num { background:var(--green); color:#fff; }
    @media (max-width:560px) {
      .tab { padding:6px 11px; font-size:12px; gap:5px; }
      .tab-num { width:15px; height:15px; font-size:9px; }
    }

    /* ── Layout ── */
    .main { max-width:820px; margin:0 auto; padding:24px 16px 4px; }
    .step-header { margin-bottom:22px; }
    .step-num   { font-family:'Poppins',sans-serif; font-size:11px; font-weight:600; color:var(--navy); letter-spacing:1.2px; text-transform:uppercase; margin-bottom:6px; opacity:.85; }
    .step-title { font-family:'Poppins',-apple-system,sans-serif; font-size:23px; font-weight:700; color:var(--text); line-height:1.2; letter-spacing:-.4px; }
    .step-desc  { font-size:14px; color:var(--text-3); margin-top:5px; line-height:1.45; }

    /* ── Cards ── */
    .card { background:var(--surface); border-radius:var(--radius); padding:20px; margin-bottom:14px; border:1px solid var(--border); box-shadow:0 1px 2px rgba(15,23,42,.04); }
    .card-title { font-family:'Poppins',-apple-system,sans-serif; font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--text-3); margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border-soft); }
    .card-sub { font-size:12.5px; color:var(--text-3); margin-top:-10px; margin-bottom:16px; line-height:1.5; }
    .card-question { font-size:14px; font-weight:600; color:var(--text-2); margin-bottom:11px; }

    /* ── Checkboxes ── */
    .cb-grid   { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .cb-grid-1 { display:grid; grid-template-columns:1fr; gap:8px; }
    /* Two-state selectable item (no checkbox): white/normal → green ring + tint */
    .cb-item { display:flex; align-items:center; gap:10px; padding:11px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; transition:background .12s,border-color .12s,box-shadow .12s; -webkit-tap-highlight-color:transparent; background:var(--surface); }
    .cb-item:hover { border-color:#cbd5e1; }
    .cb-item.checked { background:#F4FDF7; border-color:var(--green); box-shadow:0 0 0 1px var(--green); }
    .cb-item input[type=checkbox] { display:none; }
    .cb-item span { font-size:14px; color:var(--text-2); user-select:none; line-height:1.3; }
    .cb-item.checked span { color:var(--green-700); font-weight:600; }

    /* ── Service selection cards (hero) ── */
    .service-grid { display:grid; grid-template-columns:1fr; gap:10px; }
    @media (min-width:520px)  { .service-grid { grid-template-columns:1fr 1fr; } }
    @media (min-width:720px)  { .service-grid { grid-template-columns:1fr 1fr 1fr; } }

    .svc-card {
      border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px 14px;
      cursor:pointer; transition:border-color .15s, box-shadow .15s, background .15s; background:var(--surface);
      -webkit-tap-highlight-color:transparent; position:relative;
    }
    .svc-card:hover { border-color:#cbd5e1; box-shadow:0 2px 8px rgba(15,23,42,.06); }
    /* Two states only (Apple-style option select): unselected = white/normal, selected = green ring + tint */
    .svc-card.selected { border-color:var(--green); background:#F4FDF7; box-shadow:0 0 0 1px var(--green); }
    .svc-card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .svc-card-name { font-family:'Poppins',-apple-system,sans-serif; font-size:15px; font-weight:600; color:var(--text); line-height:1.25; }
    .svc-card-hours {
      font-family:'Poppins',-apple-system,sans-serif;
      font-size:13px; font-weight:700; color:var(--navy);
      background:#EFF4FF; padding:3px 10px; border-radius:99px; white-space:nowrap; flex-shrink:0;
    }
    .svc-card.selected .svc-card-hours { background:var(--green); color:#fff; }
    .svc-card-benefit { font-size:12.5px; color:var(--text-2); line-height:1.5; margin-bottom:6px; }
    .svc-card-reason  { font-size:11.5px; color:var(--text-3); line-height:1.45; }
    .svc-suggest-badge {
      display:inline-block; font-size:9px; font-weight:700; letter-spacing:.5px;
      text-transform:uppercase; color:var(--navy); background:#EFF4FF;
      padding:2px 7px; border-radius:6px; margin-bottom:8px;
    }

    /* ── Total recommended service time (hero figure) ── */
    .time-total {
      background:var(--navy); color:#fff;
      border-radius:var(--radius); padding:18px 22px;
      display:flex; align-items:center; justify-content:space-between; gap:14px;
      margin-top:16px;
    }
    .time-total-label { font-family:'Poppins',-apple-system,sans-serif; font-size:13px; font-weight:600; opacity:.82; line-height:1.35; max-width:48%; }
    .time-total-value { font-family:'Poppins',-apple-system,sans-serif; font-size:46px; font-weight:800; letter-spacing:-1.5px; line-height:1; }
    .time-total-unit  { font-family:'Poppins',-apple-system,sans-serif; font-size:16px; font-weight:600; opacity:.85; margin-left:5px; }

    /* ── Technician summary ── */
    .summary-preview {
      background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm);
      padding:15px 16px; font-size:14px; line-height:1.8; color:var(--text-2);
      white-space:pre-wrap; min-height:80px; transition:border-color .2s,background .2s;
    }
    .summary-preview.active { background:#F4FDF7; border-color:#BBF0CE; }
    .summary-hint { color:var(--gray-soft); font-size:13px; font-style:italic; }

    /* ── Findings ── */
    .findings-cat { margin-bottom:14px; }
    .findings-cat:last-child { margin-bottom:0; }
    .findings-cat-label { font-family:'Poppins',sans-serif; font-size:13px; font-weight:600; color:var(--text-2); margin-bottom:9px; display:flex; align-items:center; gap:7px; }

    /* ── Form ── */
    .form-group { margin-bottom:14px; }
    .form-group:last-child { margin-bottom:0; }
    label.form-label { display:block; font-size:11.5px; font-weight:600; color:var(--text-3); margin-bottom:6px; letter-spacing:.2px; text-transform:uppercase; }
    .form-input, .form-textarea {
      width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm);
      font-size:15px; color:var(--text); background:var(--surface);
      transition:border-color .15s,box-shadow .15s;
      -webkit-appearance:none; appearance:none; font-family:inherit;
    }
    .form-input::placeholder, .form-textarea::placeholder { color:var(--gray-soft); }
    .form-input:focus, .form-textarea:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(30,58,138,.12); }
    .form-textarea { min-height:82px; resize:vertical; line-height:1.55; }
    .input-row   { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .input-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

    /* ── Assessment ratings ── */
    .assess-row { margin-bottom:14px; }
    .assess-name { font-size:14px; font-weight:600; color:var(--text-2); margin-bottom:8px; }
    .rating-row { display:flex; gap:7px; }
    .rating-btn { flex:1; padding:11px 4px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); font-family:'Poppins',sans-serif; font-size:14px; font-weight:700; color:var(--text-3); cursor:pointer; transition:all .12s; text-align:center; -webkit-tap-highlight-color:transparent; line-height:1.2; }
    .rating-btn:hover { border-color:#cbd5e1; }
    .rating-btn small { display:block; font-size:9px; font-weight:600; opacity:.7; margin-top:1px; }
    .rating-btn:active { transform:scale(.96); }
    .rating-btn.sel-A { background:var(--A-bg); border-color:var(--A-border); color:var(--A); }
    .rating-btn.sel-B { background:var(--B-bg); border-color:var(--B-border); color:var(--B); }
    .rating-btn.sel-C { background:var(--C-bg); border-color:var(--C-border); color:var(--C); }
    .rating-btn.sel-D { background:var(--D-bg); border-color:var(--D-border); color:var(--D); }

    /* ── Qualitative ── */
    .qual-row { display:flex; gap:7px; }
    .qual-btn { flex:1; padding:10px 4px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; cursor:pointer; text-align:center; color:var(--text-3); transition:all .12s; -webkit-tap-highlight-color:transparent; }
    .qual-btn:hover { border-color:#cbd5e1; }
    .qual-btn.sel { background:#F0F6FF; border-color:var(--navy); color:var(--navy); }

    /* ── Status badge (condition summary) ── */
    .status-card { border-radius:var(--radius); padding:15px 18px; display:flex; align-items:center; gap:15px; border:1px solid var(--border); background:var(--surface); }
    .status-dot  { width:44px; height:44px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; color:#fff; flex-shrink:0; }
    .status-info h2 { font-family:'Poppins',sans-serif; font-size:18px; font-weight:700; line-height:1.2; }
    .status-info p  { font-size:13px; color:var(--text-3); margin-top:3px; line-height:1.45; }
    .s-excellent .status-dot { background:#16a34a; } .s-excellent .status-info h2 { color:#15803d; }
    .s-good      .status-dot { background:#65a30d; } .s-good .status-info h2      { color:#4d7c0f; }
    .s-fair      .status-dot { background:#d97706; } .s-fair .status-info h2      { color:#b45309; }
    .s-attention .status-dot { background:#dc2626; } .s-attention .status-info h2 { color:#b91c1c; }

    /* ── Mini table ── */
    .mini-table { width:100%; border-collapse:collapse; }
    .mini-table td { padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:14px; }
    .mini-table tr:last-child td { border-bottom:none; }
    .mini-table .cat { color:var(--text-3); width:55%; }
    .rating-pill { display:inline-block; padding:2px 11px; border-radius:99px; font-family:'Poppins',sans-serif; font-size:13px; font-weight:700; }
    .pill-A { background:var(--A-bg); color:var(--A); } .pill-B { background:var(--B-bg); color:var(--B); }
    .pill-C { background:var(--C-bg); color:var(--C); } .pill-D { background:var(--D-bg); color:var(--D); }
    .pill-none { background:var(--border-soft); color:var(--gray-soft); }

    /* ── Nav ── */
    .nav-wrap  { position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-top:1px solid var(--border); z-index:200; }
    .nav-inner { max-width:820px; margin:0 auto; padding:11px 16px 15px; display:flex; gap:10px; }
    .btn { flex:1; padding:14px; border:none; border-radius:var(--radius); font-family:'Poppins',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:all .15s; -webkit-tap-highlight-color:transparent; }
    .btn:active { transform:scale(.98); }
    .btn-back { background:var(--surface); border:1px solid var(--border); color:var(--text-3); flex:.5; }
    .btn-next { background:var(--navy); color:#fff; }
    .btn-next:hover { background:var(--navy-700); }
    .btn-pdf  { flex:1.4; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-pdf:hover { background:var(--green-700); }

    /* ── Overlay ── */
    .overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; color:#fff; }
    .overlay .spin { width:46px; height:46px; border:4px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .overlay p { font-size:15px; font-weight:600; }

    .divider { height:1px; background:var(--border-soft); margin:16px 0; }

    #pdf-template { position:fixed; left:-9999px; top:0; width:820px; background:#fff; font-family:'Helvetica Neue',Arial,sans-serif; }

    /* ── Live report preview pane (hidden on phones / iPad portrait) ── */
    .preview-pane { display:none; }
    .preview-head { display:none; }

    @media (max-width:480px) { .cb-grid { grid-template-columns:1fr; } .input-row { grid-template-columns:1fr; } }

    /* ── iPad landscape & desktop: 2-column (form | live preview) ── */
    @media (min-width:1024px) {
      body { padding-bottom:0; }
      .main { max-width:none; margin:0 var(--pv-w) 0 0; padding:24px 36px 104px; }
      .nav-wrap { right:var(--pv-w); }
      .nav-inner { max-width:none; }

      /* Report step: PDF is the star — hide the live pane, go full width */
      body.on-report .main { margin-right:0; }
      body.on-report .nav-wrap { right:0; }
      body.on-report .preview-pane { display:none; }

      .preview-pane {
        display:flex; flex-direction:column;
        position:fixed; right:0; bottom:0; top:var(--app-header-h,92px);
        width:var(--pv-w);
        background:#EEF2F6; border-left:1px solid var(--border); z-index:150;
      }
      .preview-head {
        display:flex; align-items:center; justify-content:space-between;
        flex:0 0 auto; padding:11px 16px; background:#fff; border-bottom:1px solid var(--border);
        font-family:'Poppins',sans-serif; font-size:11px; font-weight:600;
        color:var(--text-3); text-transform:uppercase; letter-spacing:.7px;
      }
      .preview-dl {
        font-family:'Poppins',sans-serif; font-size:11px; font-weight:600; letter-spacing:.2px;
        text-transform:none; color:#fff; background:var(--green); border:none; cursor:pointer;
        padding:6px 12px; border-radius:8px; display:inline-flex; align-items:center; gap:5px;
      }
      .preview-dl:hover { background:var(--green-700); }
      .preview-body { flex:1; overflow-y:auto; padding:18px; -webkit-overflow-scrolling:touch; }
    }
    @media (min-width:1024px) and (max-width:1180px) {
      :root { --pv-w:280px; }
      .main { padding-left:24px; padding-right:24px; }
    }

    /* ── Preview document (the mini report shown in the right pane) ── */
    .pv-doc { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(15,23,42,.06); }
    .pv-head { background:var(--navy); color:#fff; padding:14px 16px; }
    .pv-head-top { font-size:8.5px; letter-spacing:1.4px; text-transform:uppercase; opacity:.6; margin-bottom:4px; }
    .pv-piano { font-family:'Poppins',sans-serif; font-size:16px; font-weight:700; letter-spacing:-.3px; line-height:1.15; }
    .pv-meta { display:flex; justify-content:space-between; align-items:flex-end; margin-top:6px; font-size:10.5px; }
    .pv-meta .pv-cust { font-weight:600; opacity:.95; }
    .pv-meta .pv-date { opacity:.7; }
    .pv-status { display:inline-block; margin-top:8px; font-family:'Poppins',sans-serif; font-size:10px; font-weight:700; padding:2px 9px; border-radius:99px; }
    .pv-body { padding:14px 16px; }
    .pv-sec { margin-bottom:14px; }
    .pv-sec:last-child { margin-bottom:0; }
    .pv-sec-title { font-family:'Poppins',sans-serif; font-size:8.5px; font-weight:700; letter-spacing:.9px; text-transform:uppercase; color:var(--text-3); padding-bottom:5px; margin-bottom:8px; border-bottom:1px solid var(--border-soft); }
    .pv-goal { font-size:11px; color:var(--text-2); line-height:1.65; }
    .pv-goal .pv-imp { color:var(--navy); font-weight:700; }
    .pv-goal .pv-pre { color:var(--green-700); font-weight:700; }
    .pv-summary { font-size:11px; color:var(--text-2); line-height:1.65; white-space:pre-wrap; }
    .pv-svc { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--border-soft); }
    .pv-svc:last-of-type { border-bottom:none; }
    .pv-svc-name { font-size:11.5px; font-weight:600; color:var(--text); }
    .pv-svc-h { font-family:'Poppins',sans-serif; font-size:11px; font-weight:700; color:var(--navy); background:#EFF4FF; padding:2px 8px; border-radius:99px; white-space:nowrap; }
    .pv-total { display:flex; align-items:center; justify-content:space-between; background:var(--navy); color:#fff; border-radius:8px; padding:9px 14px; margin-top:8px; }
    .pv-total-l { font-family:'Poppins',sans-serif; font-size:9px; font-weight:600; letter-spacing:.6px; text-transform:uppercase; opacity:.78; }
    .pv-total-v { font-family:'Poppins',sans-serif; font-size:20px; font-weight:700; letter-spacing:-.5px; }
    .pv-total-v small { font-size:11px; font-weight:600; opacity:.8; margin-left:3px; }
    .pv-benefit { display:flex; gap:7px; align-items:flex-start; font-size:11px; color:var(--text-2); line-height:1.5; margin-bottom:4px; }
    .pv-benefit .pv-star { color:var(--green); font-weight:800; }
    .pv-row { display:flex; align-items:center; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border-soft); font-size:11px; }
    .pv-row:last-child { border-bottom:none; }
    .pv-row .pv-cat { color:var(--text-3); }
    .pv-pill { font-family:'Poppins',sans-serif; font-size:10.5px; font-weight:700; padding:1px 9px; border-radius:99px; }
    .pv-empty { font-size:11px; color:var(--gray-soft); font-style:italic; padding:2px 0; }

function joinEmbeds(items) {
  if (!items.length) return '';
  const emb = items.map(i => isJa ? (i.jaE||i.ja) : (i.enE||i.en));
  if (emb.length===1) return emb[0];
  if (emb.length===2) return emb.join(isJa?'と':' and ');
  return emb.slice(0,-1).join(isJa?'・':', ')+(isJa?'および':', and ')+emb[emb.length-1];

function generateTechnicianSummary() {
  const tone=getSel('tone'), touch=getSel('touch'), tun=getSel('tuning'),
        ped=getSel('pedals'), ov=getSel('overall');
  const ovKeys=ov.map(i=>i.key);
  const any=arr=>arr.length>0;
  const anyIssue=any(tone)||any(touch)||any(tun)||any(ped);
  const tw=touchWeightOf(S);
  const twHeavy=tw && (tw.bwStatus==='high'||tw.frStatus==='high');
  if(!any(ov)&&!anyIssue&&!twHeavy) return '';

  const isPlayable=ovKeys.includes('playable'), isMaint=ovKeys.includes('maintenance'),
        isFollow=ovKeys.includes('followup'), isRepair=ovKeys.includes('repair');
  const areas=[];
  if(any(tone))  areas.push(isJa?'音色':'tone quality');
  if(any(touch)) areas.push(isJa?'タッチ':'touch');
  if(any(tun))   areas.push(isJa?'調律安定性':'tuning stability');
  if(any(ped))   areas.push(isJa?'ペダル':'pedal function');

  const areaStr=areas.length===0?'':areas.length===1?areas[0]
    :areas.slice(0,-1).join(isJa?'・':', ')+(isJa?'と':' and ')+areas[areas.length-1];
  const paras=[];

  let open;
  if(isRepair)       open=isJa?'このピアノは修理のご相談をお勧めします。':'This piano requires repair consultation.';
  else if(isFollow)  open=isJa?'このピアノの状態は経過観察が推奨されます。':'This piano requires follow-up inspection to monitor its condition.';
  else if(isMaint)   open=isJa?'このピアノは演奏可能な状態ですが、メンテナンスをお勧めします。':'This piano is in playable condition, but maintenance is recommended.';
  else if(isPlayable)open=isJa?'このピアノは演奏可能な状態です。':'This piano is in playable condition.';
  else               open=isJa?'今回の診断で以下の所見が確認されました。':'The following findings were noted during the inspection.';
  if(areaStr) open+=(isJa?`${areaStr}に改善の余地があります。`:` There is room for improvement in ${areaStr}.`);
  paras.push(open);

  if(any(tone)){const j=joinEmbeds(tone);paras.push(isJa?`音色には${j}が見られます。整音やハンマー整形により、より均一で落ち着いた音色が期待できます。`:`The tone shows ${j}. Voicing and hammer shaping may help create a more even and mellow sound.`);}
  if(any(touch)){const j=joinEmbeds(touch);paras.push((isJa?'また、':'')+( isJa?`タッチには${j}が感じられます。アクション調整により、より均一で弾きやすいタッチが期待できます。`:`The touch shows ${j}. Action regulation may help create a more even and responsive feel.`));}
  if(twHeavy){
    const hi=[];
    if(tw.bwStatus==='high') hi.push(isJa?'バランスウェイト':'balance weight');
    if(tw.frStatus==='high') hi.push(isJa?'フリクション':'friction');
    const hiStr = hi.length===2?(isJa?'バランスウェイトおよびフリクション':'balance weight and friction'):hi[0];
    paras.push((isJa?'また、':'')+( isJa
      ? `タッチ重量の測定では、${hiStr}が高めに出ています。タッチが重く感じられる原因として、アクションの抵抗やウェイトバランスが影響している可能性があります。`
      : `Touch weight measurements indicate higher ${hiStr}. This may contribute to a heavier touch feel and suggests that action resistance or weight balance should be reviewed.`));
  }
  if(any(tun)){const j=joinEmbeds(tun);paras.push((isJa&&(any(tone)||any(touch))?'また、':'')+(isJa?`調律面では${j}が見られます。継続してこの傾向が確認される場合は、チューニングピンや弦周りの詳細点検をお勧めします。`:`The piano shows ${j}. If this continues, a detailed inspection of the tuning pins and strings is recommended.`));}
  if(any(ped)){const j=joinEmbeds(ped);paras.push((isJa&&anyIssue?'また、':'')+(isJa?`ペダルには${j}が確認されました。ペダル整備をお勧めします。`:`The pedals show ${j}. Pedal service is recommended.`));}
  if(anyIssue||isMaint||isRepair||twHeavy) paras.push(isJa?'定期的なメンテナンスにより、より快適な演奏状態を保つことができます。':'Regular maintenance will help keep the piano in a more comfortable playing condition.');
  return paras.join('\n\n');
}

window.setRating=(key,val)=>{
  S[key]=val;
  const order=['touch','tone','action','hammers','pedals','tuningStability'];
  const idx=order.indexOf(key);
  const rows=document.querySelectorAll('.assess-row');
  if(idx>=0&&rows[idx])rows[idx].querySelectorAll('.rating-btn').forEach((btn,bi)=>{const r=['A','B','C','D'][bi];btn.className='rating-btn'+(val===r?' sel-'+r:'');});

window.toggleFinding=(cat,idx)=>{
  if(!S.findings[cat]) S.findings[cat]=Array(FD[cat].items.length).fill(false);
  S.findings[cat][idx]=!S.findings[cat][idx];
  const lbl=document.querySelector(`[data-finding="${cat}-${idx}"]`);
  if(lbl){lbl.classList.toggle('checked',S.findings[cat][idx]);const cb=lbl.querySelector('input');if(cb)cb.checked=S.findings[cat][idx];}
  updateSummaryPreview();
  save();
};
window.toggleService=id=>{
  const idx=S.selectedServices.indexOf(id);
  if(idx>=0) S.selectedServices.splice(idx,1);
  else S.selectedServices.push(id);
  // Update card UI
  document.querySelectorAll('.svc-card').forEach(el=>{
    const onclick=el.getAttribute('onclick');
    if(onclick&&onclick.includes(`'${id}'`)){
      const sel=S.selectedServices.includes(id);
      el.classList.toggle('selected',sel);

  const tot=document.querySelector('.time-total-value');

// ── PDF ───────────────────────────────────────────────────────────
async function generatePDF() {
  collectStep();
  const overlay=document.getElementById('overlay');
  document.getElementById('overlay-text').textContent=t('generatingPDF');
  overlay.style.display='flex';
  try {
    await new Promise(r=>setTimeout(r,60));
    buildPDFTemplate();
    await new Promise(r=>setTimeout(r,200));
    const tmpl=document.getElementById('pdf-template');
    const canvas=await html2canvas(tmpl,{scale:2,useCORS:true,logging:false,backgroundColor:'#ffffff',width:820});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pdfW=pdf.internal.pageSize.getWidth(),pdfH=pdf.internal.pageSize.getHeight();
    const margin=8,availW=pdfW-margin*2;
    const imgH=availW*(canvas.height/canvas.width);
    if(imgH<=pdfH-margin*2){
      pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',margin,margin,availW,imgH);
    } else {
      const pageH=pdfH-margin*2,scale=availW/canvas.width;
      let srcY=0,page=0;
      while(srcY<canvas.height){
        if(page>0)pdf.addPage();
        const srcH=Math.min(pageH/scale,canvas.height-srcY);
        const pc=document.createElement('canvas');pc.width=canvas.width;pc.height=srcH;
        pc.getContext('2d').drawImage(canvas,0,srcY,canvas.width,srcH,0,0,canvas.width,srcH);
        pdf.addImage(pc.toDataURL('image/jpeg',0.95),'JPEG',margin,margin,availW,srcH*scale);
        srcY+=srcH;page++;
      }
    }
    pdf.save(`piano-health-report-${S.inspectionDate||'report'}.pdf`);
  } catch(err){console.error(err);alert('PDF generation failed. Please try again.');}
  finally{overlay.style.display='none';}
}

        </div>`:''}
        ${(presSel.length||S.preserveComment)?`<div style="flex:1">
          <div style="font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">${t('pdfPreserve')}</div>
          ${presSel.map(o=>check(o,'#22c55e')).join('')}
          ${S.preserveComment?`<div style="margin-top:5px;padding:5px 9px;background:#f0fdf4;border-radius:6px;font-size:11px;color:#475569;font-style:italic">${esc(S.preserveComment)}</div>`:''}

          ${st?`<div style="font-size:10px;color:${st.color};margin-top:1px">${st.note}</div>`:''}

        <svg width="16" height="14" viewBox="0 0 46 40" fill="none"><rect x="15" y="2" width="7" height="17" rx="1.8" fill="#94a3b8"/><rect x="24" y="2" width="7" height="17" rx="1.8" fill="#94a3b8"/><rect x="33" y="2" width="7" height="17" rx="1.8" fill="#94a3b8"/><path d="M6 6 L6 21 C6 23.5 7.2 24.5 9 24.5 C10.8 24.5 12 23.5 12 21 L12 6" stroke="#94a3b8" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 24.5 L9 32" stroke="#94a3b8" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M16 28 L23 35 L38 19" stroke="#22C55E" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Piano Service Planner

// ── Utils ─────────────────────────────────────────────────────────
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// Customer display name with honorific (display only — raw customerName is stored unchanged)
function displayName(name){const n=(name||'').trim();if(!n)return'';return isJa?(n+'様'):('Mr./Ms. '+n);}

// ── Live report preview (iPad landscape 2-column right pane) ───────
function buildPreviewHTML() {
  const status=getOverallStatus();
  const io=t('improveOpts'),po=t('preserveOpts');
  const impSel=io.filter((_,i)=>S.improve[i]), presSel=po.filter((_,i)=>S.preserve[i]);
  const summary=generateTechnicianSummary();
  const selSvcs=getSelectedServiceObjects();
  const totalHours=getTotalHours();
  const benefits=getSelectedBenefits();
  const cats=[['touch',t('touch')],['tone',t('tone')],['action',t('action')],['hammers',t('hammers')],['pedals',t('pedals')],['tuningStability',t('tuningStability')]];
  const pianoLine=[S.manufacturer,S.model].filter(Boolean).join(' ') || (isJa?'（ピアノ情報 未入力）':'(piano details pending)');
  const dateStr=S.inspectionDate||'';
  const numFields=[{key:'humidity',label:t('humidity'),unit:'%'},{key:'pitch',label:t('pitch'),unit:'Hz'}].filter(f=>S[f.key]);
  const qualFields=[{key:'keyDip',label:t('keyDip')},{key:'letOff',label:t('letOff')}].filter(f=>S[f.key]);
  const tw=getTouchWeight();
  const hasRatings=cats.some(([k])=>S[k]);
  const hasMeasure=numFields.length||qualFields.length||tw;

  const rpill={A:'background:var(--A-bg);color:var(--A)',B:'background:var(--B-bg);color:var(--B)',C:'background:var(--C-bg);color:var(--C)',D:'background:var(--D-bg);color:var(--D)'};
  const stColors={excellent:'background:#dcfce7;color:#15803d',good:'background:#ecfccb;color:#4d7c0f',fair:'background:#fef3c7;color:#b45309',attention:'background:#fee2e2;color:#b91c1c'};

  let h='<div class="pv-doc">';
  // Header
  h+=`<div class="pv-head">
    <div class="pv-head-top">${t('pdfHeaderSub')}</div>
    <div class="pv-piano">${esc(pianoLine)}</div>
    <div class="pv-meta"><span class="pv-cust">${esc(displayName(S.customerName))}</span><span class="pv-date">${esc(dateStr)}</span></div>
    ${status?`<div class="pv-status" style="${stColors[status]}">${statusLabel(status)}</div>`:''}
  </div>`;
  h+='<div class="pv-body">';
  // 1. Customer goals
  if(impSel.length||presSel.length){
    h+=`<div class="pv-sec"><div class="pv-sec-title">${t('pdfGoals')}</div><div class="pv-goal">`;
    if(impSel.length) h+=impSel.map(o=>`<div><span class="pv-imp">✓</span> ${esc(o)}</div>`).join('');
    if(presSel.length) h+=presSel.map(o=>`<div><span class="pv-pre">✓</span> ${esc(o)}</div>`).join('');
    h+='</div></div>';
  }
  // 2. Technician summary
  if(summary){
    h+=`<div class="pv-sec"><div class="pv-sec-title">${t('pdfTechSummary')}</div><div class="pv-summary">${esc(summary)}</div></div>`;
  }
  // 3. Recommended services + 4. total time
  h+=`<div class="pv-sec"><div class="pv-sec-title">${t('pdfServices')}</div>`;
  if(selSvcs.length){
    h+=selSvcs.map(s=>`<div class="pv-svc"><span class="pv-svc-name">${isJa?s.name.ja:s.name.en}</span><span class="pv-svc-h">${hourStr(s.hours)}</span></div>`).join('');
    h+=`<div class="pv-total"><span class="pv-total-l">${t('estimatedTime')}</span><span class="pv-total-v">${totalHours}<small>${isJa?t('hours'):' '+t(totalHours===1?'hour':'hours')}</small></span></div>`;
  } else {
    h+=`<div class="pv-empty">${isJa?'サービス未選択':'No services selected'}</div>`;
  }
  h+='</div>';
  // 5. Expected benefits
  if(benefits.length){
    h+=`<div class="pv-sec"><div class="pv-sec-title">${t('pdfBenefits')}</div>`;
    h+=benefits.map(b=>`<div class="pv-benefit"><span class="pv-star">✦</span><span>${esc(b)}</span></div>`).join('');
    h+='</div>';
  }
  // 6. Condition assessment
  if(hasRatings){
    h+=`<div class="pv-sec"><div class="pv-sec-title">${t('pdfAssessment')}</div>`;
    h+=cats.filter(([k])=>S[k]).map(([k,label])=>`<div class="pv-row"><span class="pv-cat">${label}</span><span class="pv-pill" style="${rpill[S[k]]}">${S[k]}</span></div>`).join('');
    h+='</div>';
  }
  // 7. Measured values
  if(hasMeasure){
    h+=`<div class="pv-sec"><div class="pv-sec-title">${t('pdfMeasure')}</div>`;
    h+=numFields.map(f=>{const st=getMeasurementStatus(f.key,S[f.key]);return`<div class="pv-row"><span class="pv-cat">${f.label}</span><span style="font-weight:600;color:var(--text-2)">${esc(S[f.key])} ${f.unit}${st?` · <span style="color:${st.color};font-weight:700">${st.label}</span>`:''}</span></div>`;}).join('');
    h+=qualFields.map(f=>`<div class="pv-row"><span class="pv-cat">${f.label}</span><span style="font-weight:600;color:var(--text-2)">${t(S[f.key])}</span></div>`).join('');
    if(tw){
      h+=`<div class="pv-row"><span class="pv-cat">${t('touchWeight')}</span><span style="font-weight:600;color:var(--text-2)">${fmtG(tw.dw)}g down / ${fmtG(tw.uw)}g up</span></div>`;
      h+=`<div class="pv-row"><span class="pv-cat">${t('twBalance')}</span><span style="font-weight:700;color:${touchStatusColor(tw.bwStatus)}">${touchStatusLabel(tw.bwStatus)}</span></div>`;
      h+=`<div class="pv-row"><span class="pv-cat">${t('twFriction')}</span><span style="font-weight:700;color:${touchStatusColor(tw.frStatus)}">${touchStatusLabel(tw.frStatus)}</span></div>`;
    }
    h+='</div>';
  }
  h+='</div></div>';
  return h;
}

function updateLivePreview() {
  const el=document.getElementById('live-preview');
  if(!el) return;
  el.innerHTML=buildPreviewHTML();
  const lbl=document.getElementById('preview-head-label');
  if(lbl) lbl.textContent=isJa?'レポートプレビュー':'Report Preview';
}

// Keep the fixed preview pane aligned just below the sticky header
function syncHeaderHeight() {
  const hdr=document.querySelector('.app-header');
  if(hdr) document.documentElement.style.setProperty('--app-header-h', hdr.offsetHeight+'px');
}
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('orientationchange', ()=>setTimeout(syncHeaderHeight,200));

// ── Saved reports store (localStorage) ────────────────────────────
const REPORTS_KEY='psp_reports';
function loadReports(){ try{const a=JSON.parse(localStorage.getItem(REPORTS_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];} }
function saveReports(arr){ try{localStorage.setItem(REPORTS_KEY,JSON.stringify(arr));}catch(e){} }
function nowISO(){ return new Date().toISOString(); }
function genReportId(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `report_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}_${Math.floor(Math.random()*900+100)}`;
}
function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso); if(isNaN(d.getTime())) return '—';
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function statusOf(st){
  const rated=CATS.map(c=>st[c]).filter(Boolean);
  if(!rated.length) return null;
  if(rated.includes('D')) return 'attention';
  if(rated.includes('C')) return 'fair';
  if(rated.includes('B')) return 'good';
  return 'excellent';
}
function buildSnapshot(){
  const s=JSON.parse(JSON.stringify(S)); delete s.step; delete s.reportId;
  // Include derived touch-weight values for the saved record (recomputed on load from downweight/upweight)
  const tw=touchWeightOf(S);
  if(tw){ s.balanceWeight=tw.bw; s.friction=tw.fr; s.balanceWeightStatus=tw.bwStatus; s.frictionStatus=tw.frStatus; }
  return s;
}
function applySnapshot(st,id){
  S={...defaultState(), ...JSON.parse(JSON.stringify(st)), step:1, reportId:id||null};
  if(!S.findings) S.findings=defaultFindings();
  FINDINGS_DATA.forEach(c=>{ if(!S.findings[c.cat]) S.findings[c.cat]=Array(c.items.length).fill(false); });
  if(!S.selectedServices) S.selectedServices=[];
  try{ localStorage.setItem('pianoHealthReport', JSON.stringify(S)); }catch(e){}
}

// Write the current working state into the reports store (create or update)
function persistCurrent(){
  const reports=loadReports();
  const snap=buildSnapshot(), now=nowISO();
  let rep = S.reportId ? reports.find(r=>r.id===S.reportId) : null;
  if(rep){ rep.state=snap; rep.updatedAt=now; }
  else {
    const id=genReportId(); S.reportId=id;
    rep={ id, createdAt:now, updatedAt:now, state:snap };
    reports.unshift(rep);
  }
  saveReports(reports);
  try{ localStorage.setItem('pianoHealthReport', JSON.stringify(S)); }catch(e){}
  return rep;
}

// Manual save (header button)
window.saveCurrent=manual=>{ persistCurrent(); if(manual) showToast(t('saved')); showSaveStatus(t('saved')); };

// Debounced auto-save (called from save())
let autoSaveTimer=null;
function scheduleAutoSave(){
  if(autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>{
    const meaningful = S.reportId || (S.customerName||'').trim() || (S.manufacturer||'').trim() || (S.model||'').trim();
    if(!meaningful) return;
    persistCurrent();
    showSaveStatus(t('autoSaved'));
  }, 1500);
}

// ── Toast & save-status ───────────────────────────────────────────
let toastTimer=null;
function showToast(msg){
  const el=document.getElementById('toast'); if(!el) return;
  document.getElementById('toast-msg').textContent=msg;
  el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
let statusTimer=null;
function showSaveStatus(text){
  const el=document.getElementById('save-status'); if(!el) return;
  el.textContent=text; el.classList.add('show');
  if(statusTimer) clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

// ── Reports list overlay ──────────────────────────────────────────
window.openReports=()=>{ renderReportsList(); document.getElementById('reports-overlay').classList.add('open'); };
window.closeReports=()=>{ document.getElementById('reports-overlay').classList.remove('open'); };
function renderReportsList(){
  const body=document.getElementById('reports-body');
  const reports=loadReports().slice().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));
  if(!reports.length){ body.innerHTML=`<div class="reports-empty">${t('noReports')}</div>`; return; }
  const stColors={excellent:'background:#dcfce7;color:#15803d',good:'background:#ecfccb;color:#4d7c0f',fair:'background:#fef3c7;color:#b45309',attention:'background:#fee2e2;color:#b91c1c'};
  body.innerHTML=reports.map(r=>{
    const st=r.state||{};
    const name=displayName(st.customerName) || t('untitledCustomer');
    const piano=[st.manufacturer,st.model].filter(Boolean).join(' ') || t('untitledPiano');
    const status=statusOf(st);
    const svc=(st.selectedServices||[]).length;
    const cur=r.id===S.reportId?' current':'';
    return `<div class="report-card${cur}">
      <div class="rc-top">
        <div style="min-width:0">
          <div class="rc-name">${esc(name)}</div>
          <div class="rc-piano">${esc(piano)}</div>
        </div>
        ${status?`<span class="rc-status" style="${stColors[status]}">${statusLabel(status)}</span>`:''}
      </div>
      <div class="rc-svc">${isJa?('推奨サービス '+svc+t('svcCountLabel')):(svc+' '+t('svcCountLabel'))}</div>
      <div class="rc-meta">${t('createdLabel')}: ${fmtDate(r.createdAt)}　・　${t('updatedLabel')}: ${fmtDate(r.updatedAt)}</div>
      <div class="rc-actions">
        <button class="rc-btn open" onclick="loadReport('${r.id}')">${t('openEdit')}</button>
        <button class="rc-btn" onclick="duplicateReport('${r.id}')">${t('duplicate')}</button>
        <button class="rc-btn del" onclick="deleteReport('${r.id}')">${t('deleteLabel')}</button>
      </div>
    </div>`;
  }).join('');
}
window.loadReport=id=>{
  const r=loadReports().find(x=>x.id===id); if(!r) return;
  applySnapshot(r.state||{}, id);
  closeReports(); render(); window.scrollTo(0,0);
  showToast(t('reportLoaded'));
};
window.duplicateReport=id=>{
  const r=loadReports().find(x=>x.id===id); if(!r) return;
  const reports=loadReports();
  const st=JSON.parse(JSON.stringify(r.state||{}));
  const now=nowISO(), newId=genReportId();
  reports.unshift({ id:newId, createdAt:now, updatedAt:now, state:st });
  saveReports(reports);
  applySnapshot(st, newId);
  closeReports(); render(); window.scrollTo(0,0);
  showToast(t('duplicated'));
};
window.deleteReport=id=>{
  if(!confirm(t('confirmDelete'))) return;
  saveReports(loadReports().filter(x=>x.id!==id));
  if(S.reportId===id){ S.reportId=null; try{localStorage.setItem('pianoHealthReport',JSON.stringify(S));}catch(e){} }
  renderReportsList();
};
window.newReport=()=>{
  S=defaultState();
  try{ localStorage.setItem('pianoHealthReport', JSON.stringify(S)); }catch(e){}
  closeReports(); render(); window.scrollTo(0,0);
  showToast(t('newStarted'));
};

function initSaveUI(){
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('btn-save-label',t('save'));
  set('btn-history-label',t('history'));
  set('reports-title',t('savedReports'));
  const nb=document.getElementById('rp-new-btn'); if(nb) nb.textContent='＋ '+t('newReport');
}

render();
initSaveUI();
syncHeaderHeight();
updateLivePreview();
</script>
